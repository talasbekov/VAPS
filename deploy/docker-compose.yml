# Story 12.1 — прод-топология (закрытый LAN, деплой носителем). nginx + app
# (uvicorn, --lifespan off) + postgres + redis. НЕ worker/beat.
#
# Обновлено Story 12.6 (review, Edge Case Hunter — предыдущая версия этого
# комментария называла «12.6» адресом worker/beat-контейнеров БЕЗ уточнения,
# написана ДО create-story 12.6's декомпозиции): Celery теперь установлен,
# три @shared_task существуют и зарегистрированы в CELERY_BEAT_SCHEDULE
# (config/settings.py) — но САМИ КОНТЕЙНЕРЫ (`celery -A config worker`/
# `celery -A config beat`) сюда ещё не добавлены. Буква эпика 12.6 бандлит
# два разных теста (статический gate-тест «задача существует/импортируется»
# — БЕЗ брокера — и smoke ЧЕРЕЗ БРОКЕР в test-full, которому нужны живые
# worker+beat) — разбито на 12.6 (эта регистрация, done) и 12.6a (контейнеры
# здесь + брокер-smoke, backlog). CELERY_BEAT_SCHEDULE сегодня — «мёртвая»
# конфигурация в реально развёрнутом стеке до 12.6a, задокументировано явно,
# не молчаливый пробел.
#
# Существующий Backend/VAPS/docker-compose.yml (Postgres-харнесс `make gate`,
# порт 5433) — ОТДЕЛЬНЫЙ файл, не трогается и не переиспользуется (запрет,
# повторённый 1.9/6.1/11.5/11.6a).
#
# HTTPS/TLS — сознательно отсутствует (architecture.md#L321: «эпик production
# hardening, не блокирует первый релиз: закрытый LAN»). Порт 80 наружу.
# restart: unless-stopped на всех четырёх сервисах (найдено ревью): без него
# перезагрузка хоста/OOM-килл контейнера не поднимает стек обратно
# автоматически — реальный риск для «носитель довёз, закрытый LAN, никто не
# смотрит на дашборд» модели эксплуатации. `unless-stopped`, не `always`:
# осознанный `docker compose down` не должен сам себя поднимать обратно.
services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # Story 12.5 (review, Edge Case Hunter): parametrized so
    # deploy-rehearsal.sh can bind an alternate host port — install.sh
    # (12.3) brings up ALL 4 services with no filter, unlike
    # restore-rehearsal.sh (12.4), which deliberately skips nginx. A
    # rehearsal reusing install.sh unfiltered on a machine already running
    # the real vaps-install stack would otherwise collide on :80. A real
    # install (no override) still gets 80 — unchanged default.
    ports:
      - "${VAPS_NGINX_PORT:-80}:80"
    environment:
      # envsubst-шаблон (официальный механизм nginx-образа: любой файл в
      # /etc/nginx/templates/*.template рендерится в /etc/nginx/conf.d/*.conf
      # на старте контейнера — не самодельный entrypoint).
      - VAPS_PRIVATE_STORAGE_ROOT=/protected-storage
      - STATIC_ROOT=/app-static
      - VAPS_XACCEL_LOCATION=${VAPS_XACCEL_LOCATION:-/protected}
      # :?  не :-  — найдено ревью: пустое/незаданное значение рендерит
      # `map`-строку `"" 1;`, которая пропускает WS-запросы БЕЗ заголовка
      # Origin вовсе (не браузерные клиенты его могут не слать) — fail-open
      # ровно там, где обязательство config/asgi.py требует fail-closed
      # Origin-гард. `docker compose up` обязан упасть явно, а не тихо
      # поднять открытый WS.
      - VAPS_ALLOWED_ORIGIN=${VAPS_ALLOWED_ORIGIN:?VAPS_ALLOWED_ORIGIN must be set — see deploy/.env.example}
    volumes:
      - ./nginx/vaps.conf.template:/etc/nginx/templates/vaps.conf.template:ro
      - private_storage:/protected-storage:ro
      - static_files:/app-static:ro
      # Bind-mount, не именованный volume: собранный фронт (`npm run build`)
      # живёт на хосте, nginx его не собирает — сборка вне compose (12.2's
      # bundle.sh автоматизирует перенос; здесь — прямой путь для ручного
      # `docker compose up`, AC-6).
      - ../frontend/dist:/frontend-dist:ro
      # Найдено живым прогоном: образ несёт свой /etc/nginx/conf.d/default.conf
      # с явным `server_name localhost;` — точное совпадение имени сервера
      # побеждает НАШ `default_server` для любого запроса с заголовком
      # `Host: localhost` (типичный локальный curl/браузер), и весь наш
      # server-блок остаётся недостижимым молча (симптом — 404 от
      # /usr/share/nginx/html, не ошибка конфигурации). Глушится нулевым
      # байндом — стандартный docker-приём, не полагаться на один только
      # `default_server`.
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/admin/login/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: ../Backend/VAPS
      dockerfile: Dockerfile
    # Story 12.3: named alongside `build:` so `docker compose up` on a
    # target machine — which has bundle.sh's (12.2) loaded image tar but
    # NOT the Backend/VAPS source tree to build from — uses the already-
    # loaded, exact-sha image instead of failing to rebuild. install.sh
    # exports VAPS_APP_SHA from the bundle's manifest.json before `up`;
    # a plain dev `docker compose build` still works (build: stays).
    image: "vaps-app:${VAPS_APP_SHA:-dev}"
    restart: unless-stopped
    # Миграции — ПЕРЕД uvicorn, не в отдельном одноразовом сервисе: 12.1
    # ограничена топологией compose up, install.sh's полноценный чек-сумма→
    # бэкап→load→migrate→smoke рунбук — 12.3.
    command: sh -c "python manage.py migrate --noinput && uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --lifespan off"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Топология внутри compose-сети — постоянна, НЕ из .env (оператор не
      # должен переоткрывать эти два значения на каждом деплое).
      - VAPS_DB_HOST=postgres
      - VAPS_DB_PORT=5432
      - VAPS_PRIVATE_STORAGE_ROOT=/protected-storage
      - VAPS_STATIC_ROOT=/app/staticfiles
    volumes:
      - private_storage:/protected-storage
      - static_files:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${VAPS_DB_USER}
      - POSTGRES_PASSWORD=${VAPS_DB_PASSWORD}
      - POSTGRES_DB=${VAPS_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт НЕ пробрасывается наружу (в отличие от гейт-харнесса 5433) — прод-БД
    # доступна только внутри compose-сети.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VAPS_DB_USER} -d ${VAPS_DB_NAME} -h 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # Порт НЕ пробрасывается наружу (в отличие от гейт-харнесса 6380).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  private_storage:
  static_files:
