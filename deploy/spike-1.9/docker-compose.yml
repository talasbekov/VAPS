# Спайк 1.9 — контур-проба пути носителя. ОДИН сервис: статическая nginx-страница-маркер.
# ЭТО НЕ прод-топология (nginx+uvicorn+worker+beat+postgres+redis) — она в 12.1.
# Нет ключа `build:` намеренно: в контуре образ берётся из `docker load` (.tar), а не собирается.
# Существующий Backend/VAPS/docker-compose.yml (Postgres-харнесс гейта) к этому файлу отношения не имеет.
services:
  probe:
    image: vaps-probe:spike-1.9
    ports:
      # Проброс на LAN-порт. Открывать С ОТДЕЛЬНОЙ клиентской машины (localhost ≠ доказательство).
      - "8080:80"
    restart: "no"   # одноразовая проба, не сервис
