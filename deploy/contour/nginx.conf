map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# WebSocket authentication can use a query JWT. Keep the URI path, never the
# full request/request_uri, args or Referer (which can also contain a query).
log_format contour_path '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;
    # Preserve the browser's external LAN port when nginx returns /admin/ etc.
    absolute_redirect off;
    access_log /var/log/nginx/access.log contour_path;
    # The contour entrypoint sanitizes stderr before it reaches Docker logs.
    error_log stderr notice;
    client_max_body_size 30m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location /staticfiles/ { alias /data/static/; }
    location /static/ { alias /data/static/; }
    location /media/ { alias /data/media/; }
    location /ops-private/ { internal; alias /data/private/; }
    location = /api/auth { return 308 /api/auth/; }
    location ^~ /api/auth/ { proxy_pass http://frontend:3000; }
    location /api/ { proxy_pass http://backend:8000; }
    location = /admin { return 308 /admin/; }
    location /admin/ { proxy_pass http://backend:8000; }
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
    location / { proxy_pass http://frontend:3000; }
}
