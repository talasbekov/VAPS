# systemd drop-in for vaps-backend.service — install to
#   /etc/systemd/system/vaps-backend.service.d/10-wait-for-deps.conf
#
# A drop-in, not a replacement unit: it appends ExecStartPre and touches
# nothing else, so the live unit keeps its WorkingDirectory, its ExecStart and
# all its Environment= lines (including the Sentry DSN) exactly as they are.
#
# Invoked with the backend's venv interpreter on purpose — see the module
# docstring in wait-for-deps.py. The system python3 lacks redis/psycopg.
[Service]
ExecStartPre=/root/projects/VAPS/Backend/VAPS/.venv/bin/python /root/projects/VAPS/deploy/systemd/wait-for-deps.py 60
