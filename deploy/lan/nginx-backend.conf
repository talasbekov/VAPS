server {
    listen 81;
    server_name _;
    absolute_redirect off;
    access_log /var/log/nginx/access.log contour_path;
    error_log stderr notice;
    client_max_body_size 30m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    location /staticfiles/ { alias /data/static/; }
    location /static/ { alias /data/static/; }
    location /media/ { alias /data/media/; }
    location /ops-private/ { internal; alias /data/private/; }
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }
    location / { proxy_pass http://backend:8000; }
}
