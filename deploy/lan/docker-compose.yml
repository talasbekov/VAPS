name: ${STACK_NAME:-smart-josparlau-lan}
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: organization_management.config.settings.lan
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run configure.py}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Run configure.py}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Run configure.py}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Run configure.py}
  COOKIE_SECURE: ${COOKIE_SECURE:-0}
  TIME_ZONE: ${TIME_ZONE:-Asia/Almaty}
  ENABLE_BACKGROUND_TASKS: ${ENABLE_BACKGROUND_TASKS:-1}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-smart_josparlau}
  POSTGRES_USER: ${POSTGRES_USER:-smart_josparlau}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run configure.py}
  REDIS_HOST: redis
  TZ: UTC
x-backend: &backend
  image: ${BACKEND_IMAGE:?Missing images.env}
  pull_policy: never
  restart: unless-stopped
  environment: *backend-env
  volumes:
    - static:/data/static
    - media:/data/media
    - private:/data/private
  logging: *logging
services:
  db:
    image: ${POSTGRES_IMAGE:?Missing images.env}
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_josparlau}
      POSTGRES_USER: ${POSTGRES_USER:-smart_josparlau}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run configure.py}
      TZ: UTC
    ports: ["${BIND_IP:-10.15.3.187}:${POSTGRES_PORT:-5300}:5432"]
    networks: [default, ingress]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging
  redis:
    image: ${REDIS_IMAGE:?Missing images.env}
    pull_policy: never
    restart: unless-stopped
    command: [redis-server, --maxmemory, 256mb, --maxmemory-policy, noeviction, --appendonly, "yes", --appendfsync, everysec]
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
  backend:
    <<: *backend
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/admin/login/",timeout=5).read(1)']
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 180s
  worker:
    <<: *backend
    entrypoint: [celery]
    command: [-A, organization_management.config.celery, worker, --loglevel=INFO, --concurrency=2, --hostname=worker@%h]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'celery -A organization_management.config.celery inspect ping --destination "worker@$${HOSTNAME}" --timeout 5 | grep -q pong']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
  beat:
    <<: *backend
    entrypoint: [celery]
    command: [-A, organization_management.config.celery, beat, --loglevel=INFO, --schedule=/data/beat/celerybeat-schedule, --pidfile=/data/beat/celerybeat.pid]
    volumes: [beat:/data/beat]
    depends_on:
      worker: {condition: service_healthy}
  frontend:
    image: ${FRONTEND_IMAGE:?Missing images.env}
    pull_policy: never
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Run configure.py}
      NEXTAUTH_URL_INTERNAL: http://frontend:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Run configure.py}
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_DSN: ""
      TZ: UTC
    mem_limit: 1g
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/").then(r=>process.exit(r.status<400?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *logging
  proxy:
    image: ${PROXY_IMAGE:?Missing images.env}
    pull_policy: never
    restart: unless-stopped
    networks: [default, ingress]
    ports:
      - "${BIND_IP:-10.15.3.187}:${FRONTEND_PORT:-3300}:80"
      - "${BIND_IP:-10.15.3.187}:${BACKEND_PORT:-8300}:81"
    volumes:
      - static:/data/static:ro
      - media:/data/media:ro
      - private:/data/private:ro
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
    logging: *logging
networks:
  default: {internal: true}
  ingress: {driver: bridge}
volumes:
  postgres:
  redis:
  static:
  media:
  private:
  beat:
