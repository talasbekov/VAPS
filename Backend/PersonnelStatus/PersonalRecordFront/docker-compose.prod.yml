services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_MEDIA_URL=http://10.15.3.187:8100
        - PORT=3100
    container_name: frontend
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=production
      - PORT=3100
      - HOSTNAME=0.0.0.0
      # Куча V8 под mem_limit=1g. Меняется вместе с лимитом ниже.
      - NODE_OPTIONS=--max-old-space-size=512
      - NEXTAUTH_URL=http://10.15.3.187:3100
      # Секрет приходит из окружения хоста (или .env рядом с компоузом) и в
      # git не хранится; без него compose откажется стартовать. Прежнее
      # значение лежало здесь литералом — оно скомпрометировано историей
      # git, на проде секрет РОТИРОВАТЬ.
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      # Бэкенд запущен бэкендером отдельно на том же сервере
      - BACKEND_URL=http://10.15.3.187:8100
    mem_limit: 1g
    mem_reservation: 512m
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    tmpfs:
      - /app/.next/cache:size=256m,mode=1777
    restart: unless-stopped
