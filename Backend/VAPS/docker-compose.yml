services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaps
      POSTGRES_PASSWORD: vaps
      POSTGRES_DB: vaps
    ports:
      - "5433:5432"
    healthcheck:
      # -h 127.0.0.1: временный сервер initdb-фазы слушает только unix-socket,
      # TCP-проверка исключает ложный healthy до рестарта на боевую конфигурацию
      test: ["CMD-SHELL", "pg_isready -U vaps -d vaps -h 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Story 11.1: channel layer для WS-транспорта уведомлений. Порт 6380, не
  # дефолтный 6379 — зеркало решения «5433:5432» у db: у разработчика с большой
  # вероятностью уже крутится свой Redis, и коллизия проявилась бы как
  # «тесты подключились не туда».
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s
