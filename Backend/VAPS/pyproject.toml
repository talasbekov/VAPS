[project]
name = "vaps"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<5.2",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.1",
    # Story 1.8: simple .xlsx output (AC-1). Pure-Python, no C extensions,
    # offline-friendly — runs inside the air-gapped контур in the
    # migration_legacy image. The deliberate end of 1.7's zero-runtime-deps.
    "openpyxl>=3,<4",
    # Story 5.1: verify external-Auth JWTs (signature/exp/alg-allowlist). `[crypto]`
    # pulls `cryptography` for RS256/asymmetric — the issuer's public key is the
    # only trust anchor; VAPS stores no passwords (ARCH-SEC-030).
    "PyJWT[crypto]>=2,<3",
    # Story 8.3: OpenAPI-схема для кодогена типов фронта (ARCH-FE-011). Minor-пин:
    # формат вывода spectacular — контракт drift-чека (lock-файла у бэка нет),
    # апгрейд = осознанный regen-коммит schema.yaml + schema.d.ts.
    "drf-spectacular>=0.30,<0.31",
    # Story 6.3: официальный .docx расхода (перенос из донора — тот же пин
    # 1.2.0, что в donor requirements.txt; registry-снимок 1.2.0 на 2026-07-08).
    # Offline-friendly: default-template внутри пакета, сети не касается. ЧЕСТНО:
    # тянет lxml (C-extension) — осознанное отступление от openpyxl-обоснования
    # «no C extensions»; бинарные wheels вендорятся в offline-зеркало контура.
    "python-docx>=1.2,<2",
    # Story 6.4: нативный PDF расхода. Донорского прообраза НЕТ (донор PDF
    # расхода не генерирует — проверено grep'ом reports-app); выбор fpdf2
    # (registry-снимок 2.8.7 на 2026-07-08): декларативный table() +
    # add_font(TTF) для kk-глифов, API проверен эмпирически на create-story.
    # Альтернатива reportlab (донор пинит 4.5.1 в ДРУГОЙ подсистеме) отклонена
    # (Д5/Q2). ЧЕСТНО: LGPL-3.0 + тянет Pillow (C-extension), fonttools,
    # defusedxml — wheels вендорятся в offline-зеркало контура (прецедент Q2-6.3).
    "fpdf2>=2.8,<3",
    # Story 11.1: WS-транспорт уведомлений (architecture.md L337, epics.md §Epic
    # 11). channels — ASGI-роутинг (ProtocolTypeRouter/consumers); channels-redis
    # — межпроцессный channel_layer (Redis pub/sub), обязателен по AC эпика
    # ("InMemoryChannelLayer в конфиге = fail CI" — group_send из будущего Celery
    # worker'а через InMemory уходит в никуда молча). Снимок версий (веб-индекс,
    # сверено на create-story 2026-07-17): channels 4.3.2, channels-redis 4.3.0 —
    # оба Django 5.x совместимы.
    "channels>=4.3,<5",
    "channels-redis>=4.3,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.15",
    "hypothesis>=6,<7",
    # Story 6.4: парсер PDF в тестах (round-trip/extract_text); BSD-3,
    # pure-python, снимок 5.6.0 на 2026-07-08.
    "pypdf>=5,<6",
    # Story 11.1: async def test_* для channels.testing.WebsocketCommunicator —
    # pytest-django не даёт нативный asyncio event loop per test, pytest-asyncio
    # закрывает этот пробел (asyncio_mode=auto в pytest.ini_options ниже, тот же
    # паттерн, что channels/channels-redis официально документируют для тестов).
    "pytest-asyncio>=1,<2",
    # Story 11.1: НЕ выбор — `channels.testing.__init__` безусловно импортирует
    # `ChannelsLiveServerTestCase`, которая импортирует `daphne.testing` даже
    # если тест использует только `WebsocketCommunicator` (channels 4.3.2, форк
    # не выходит из этого через under-the-hood submodule import). Тест-only
    # транзитивная зависимость самого `channels` для его собственного testing-API
    # — не отдельная story-инициатива, dev-runtime (daphne ASGI-сервер) в
    # рантайме приложения НЕ используется (uvicorn — Epic 12, Story 12.1).
    "daphne>=4.0,<5",
]

[tool.setuptools]
packages = ["config", "apps", "apps.core"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["apps"]
addopts = "--strict-markers"
# Story 11.1: auto — async def test_* (channels.testing.WebsocketCommunicator)
# run without an explicit @pytest.mark.asyncio on every test; sync tests are
# unaffected (pytest-asyncio only activates for coroutine test functions).
asyncio_mode = "auto"
markers = [
    "property: property-based tests (hypothesis)",
    "concurrency: concurrency smoke tests",
    "slow: tests that take more than a few seconds",
    "golden: golden-master регрессия расхода (числа + нормализованный document.xml); только test-full",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
