components:
  schemas:
    Attachment:
      type: object
      description: Read-only проекция Attachment — ответ upload (201) и retrieve-форм.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        original_name:
          type: string
          readOnly: true
        content_type:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        sha256:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content_type
      - created_at
      - id
      - original_name
      - sha256
      - size
    AttachmentUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    AuditLog:
      type: object
      description: Read-only projection of an audit row — FR-36 fields, snake_case,
        flat.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor_user_id:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        entity_type:
          type: string
          readOnly: true
        entity_id:
          type: string
          format: uuid
          readOnly: true
        old_value:
          readOnly: true
          nullable: true
        new_value:
          readOnly: true
          nullable: true
        reason:
          type: string
          readOnly: true
        request_id:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
        user_agent:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_user_id
      - created_at
      - entity_id
      - entity_type
      - id
      - ip_address
      - new_value
      - old_value
      - reason
      - request_id
      - user_agent
    BlankEnum:
      enum:
      - ''
    BulkStatusCreateRequest:
      type: object
      description: Тело POST-запроса bulk-создания. Без ``division_id`` — scope из
        RBAC.
      properties:
        business_date:
          type: string
          format: date
        rows:
          type: array
          items:
            $ref: '#/components/schemas/BulkStatusCreateRowRequest'
      required:
      - business_date
      - rows
    BulkStatusCreateResponse:
      type: object
      properties:
        created:
          type: integer
      required:
      - created
    BulkStatusCreateRowRequest:
      type: object
      description: |-
        Одна строка-отклонение. 4 обязательных ключа зеркалят
        ``_REQUIRED_ROW_KEYS`` сервиса 3.8 (отсутствие → 400 ДО сервиса).
      properties:
        employee_id:
          type: string
          format: uuid
        status_type_code:
          type: string
          minLength: 1
          maxLength: 50
        date_start:
          type: string
          format: date
        date_end:
          type: string
          format: date
        comment:
          type: string
        document_basis:
          type: string
        source_ref:
          type: string
      required:
      - date_end
      - date_start
      - employee_id
      - status_type_code
    DailySubmission:
      type: object
      description: |-
        201/list projection — flat, snake_case, WITHOUT the heavy snapshot JSON
        (tens–hundreds of KB per row) and without the amend-only fields
        (reason/sanction/triggered_by_status_id — always empty on v1). The list
        selector defers snapshot; this serializer never touching it keeps the
        deferred column from being silently re-fetched.
      properties:
        id:
          type: integer
          readOnly: true
        division_id:
          type: string
          format: uuid
          readOnly: true
        business_date:
          type: string
          format: date
          readOnly: true
        version:
          type: integer
          readOnly: true
          default: 1
        is_current:
          type: boolean
          readOnly: true
          default: true
        event:
          allOf:
          - $ref: '#/components/schemas/EventEnum'
          readOnly: true
        submitted_by:
          type: string
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        late:
          type: boolean
          readOnly: true
      required:
      - business_date
      - division_id
      - event
      - id
      - is_current
      - late
      - submitted_at
      - submitted_by
      - version
    DailySubmissionAmendRequest:
      type: object
      description: |-
        POST /{id}/amend/ form (5.8b) — exactly the reason/sanction pair the
        API forwards to amend_day. DRF defaults (required + trim_whitespace +
        allow_blank=False) reject missing/blank/whitespace-only values at the
        boundary; ``sanction`` carries the model's CharField(255) limit — without
        it an oversized value would reach Postgres as a DataError → 500 (the same
        boundary-lets-garbage-through class as 5.8a's whitespace actor header).
        ``triggered_by_status_id`` is NOT accepted: it is the 5.4b system hook's
        provenance ref (manual HTTP amendment stores None); accepting it would let
        a client write arbitrary EmployeeStatus references. Extra payload fields,
        including submitted_by/actor, are ignored (ARCH-SEC-030, DRF-канон 5.8a Д5).
      properties:
        reason:
          type: string
          minLength: 1
        sanction:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - reason
      - sanction
    DailySubmissionCreateRequest:
      type: object
      description: |-
        POST-body form — exactly the two kwargs the API forwards to submit_day:
        a flat UUID division ref (ARCH-003) and a YYYY-MM-DD business date (closes
        the business_date=None defer class for the submit path). The actor NEVER
        comes from the payload (ARCH-SEC-030) — extra fields, including
        submitted_by, are ignored.
      properties:
        division_id:
          type: string
          format: uuid
        business_date:
          type: string
          format: date
      required:
      - business_date
      - division_id
    DayStateAmendment:
      type: object
      description: |-
        Причина/санкция ТЕКУЩЕЙ AMENDED-версии (10.6): ровно два поля из
        строки DailySubmission; ``triggered_by_status_id`` наружу НЕ едет —
        внутренний provenance-ref хука 5.4b.
      properties:
        reason:
          type: string
        sanction:
          type: string
      required:
      - reason
      - sanction
    DayStateDetail:
      type: object
      description: |-
        Detail-режим day-state (10.3): ровно одно из preview_event/traffic_light
        ненулевое — ``preview_event`` у несданного дня (семантика _diff_key
        submit_day), ``traffic_light`` у сданного (5.5a). 10.6 additive:
        ``amendment`` — причина/санкция текущей AMENDED-версии (иначе null),
        ``summary`` — свежесть сводки 5.11 (null у не-сводки).
      properties:
        preview_event:
          type: string
          nullable: true
        traffic_light:
          allOf:
          - $ref: '#/components/schemas/DayStateTrafficLight'
          nullable: true
        amendment:
          allOf:
          - $ref: '#/components/schemas/DayStateAmendment'
          nullable: true
        summary:
          allOf:
          - $ref: '#/components/schemas/DayStateSummary'
          nullable: true
      required:
      - amendment
      - preview_event
      - summary
      - traffic_light
    DayStateDivision:
      type: object
      description: |-
        Строка списка видимых подразделений: имя из core-селектора (ARCH-003)
        + submitted-состояние дня (9 полей списочной проекции) либо null.
      properties:
        division_id:
          type: string
          format: uuid
        name:
          type: string
        submission:
          allOf:
          - $ref: '#/components/schemas/DailySubmission'
          nullable: true
      required:
      - division_id
      - name
      - submission
    DayStateResponse:
      type: object
      description: '200-конверт day-state (10.3): видимые подразделения + detail|null.'
      properties:
        divisions:
          type: array
          items:
            $ref: '#/components/schemas/DayStateDivision'
        detail:
          allOf:
          - $ref: '#/components/schemas/DayStateDetail'
          nullable: true
      required:
      - detail
      - divisions
    DayStateSummary:
      type: object
      description: |-
        Derived-свежесть сводки (10.6) — проекция ``SummaryFreshness`` 5.11 как
        есть: status FRESH/STALE + три оси; null (на уровне detail) у обычной
        сдачи без ``sources`` и несданного дня.
      properties:
        status:
          type: string
        superseded:
          type: array
          items:
            $ref: '#/components/schemas/DayStateSummarySuperseded'
        missing:
          type: array
          items:
            $ref: '#/components/schemas/DayStateSummaryMissing'
        unpinned:
          type: array
          items:
            type: string
      required:
      - missing
      - status
      - superseded
      - unpinned
    DayStateSummaryMissing:
      type: object
      description: 'Ось missing: у запиненного ребёнка не осталось current («ноль
        текущих»).'
      properties:
        division_id:
          type: string
        pinned_version:
          type: integer
      required:
      - division_id
      - pinned_version
    DayStateSummarySuperseded:
      type: object
      description: 'Ось superseded свежести сводки 5.11: пин ребёнка вытеснен новой
        версией.'
      properties:
        division_id:
          type: string
        pinned_version:
          type: integer
        current_version:
          type: integer
      required:
      - current_version
      - division_id
      - pinned_version
    DayStateTrafficLight:
      type: object
      description: |-
        Светофор 5.5a сданного дня: {status, late, drift} — schema-проекция
        ``DivisionTrafficLight`` (drift — {added, removed, changed}|null).
      properties:
        status:
          type: string
        late:
          type: boolean
        drift:
          nullable: true
      required:
      - drift
      - late
      - status
    Division:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
        parent:
          type: string
          format: uuid
          nullable: true
        type_code:
          type: string
        name:
          type: string
          maxLength: 255
        code:
          type: string
          maxLength: 100
        is_active:
          type: boolean
      required:
      - code
      - id
      - name
      - organization
      - type_code
    DivisionRequest:
      type: object
      properties:
        organization:
          type: string
          format: uuid
        parent:
          type: string
          format: uuid
          nullable: true
        type_code:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 255
        code:
          type: string
          minLength: 1
          maxLength: 100
        is_active:
          type: boolean
      required:
      - code
      - name
      - organization
      - type_code
    Employee:
