          format: date
        overridden_by:
          type: string
        reason:
          type: string
      required:
      - business_date
      - overridden_by
      - reason
    TrafficTreeNode:
      type: object
      description: |-
        Узел светофор-дерева (10.4, контракт 10-01 §5, Д1 — плоский список):
        ``status``/``late`` — байт-в-байт из каскада 5.5b (``CascadeTrafficLight``),
        ``name``/``parent_id`` дособраны из core-справочника; ``parent_id = null``
        у корней видимой области. Ровно 5 полей Д-shape — drift/responsible/
        счётчиков НЕТ (ловушка ревью 10.1 P2).
      properties:
        division_id:
          type: string
          format: uuid
        name:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
        late:
          type: boolean
      required:
      - division_id
      - late
      - name
      - parent_id
      - status
    TrafficTreeResponse:
      type: object
      description: |-
        200-конверт traffic-tree (10.4): плоский лес с parent_id-ссылками,
        порядок узлов детерминирован (name, division_id).
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TrafficTreeNode'
      required:
      - nodes
