      description: 'Журнал выпусков расхода (10.5): видимые под daily_report.generate
        подразделения (источник селекта экрана) + ВСЕ выпуски (ISSUED и SUPERSEDED)
        по выбранному подразделению или по всем видимым, новые сверху (-year, -number);
        строка несёт цепочку «взамен» (supersedes {id, number, year} | null). Пагинация
        limit/offset (default 50, max 200) — на issues; дата журнал НЕ фильтрует.
        400 мусорный division_id; 403 чужое подразделение (ДО существования); 404
        фантомный UUID у глобального гранта; пустая видимость → 200 пустые списки.'
