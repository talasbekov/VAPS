    KindEnum:
      enum:
      - SUBMISSION_LAGGING
      - SUBMISSION_THRESHOLD_ALERT
      - PILOT_PULSE_DIGEST
      - GROUP_FORCE_REQUEST_ESCALATED
      - TEMP_PERMISSION_ACTIVE
      - TEMP_PERMISSION_EXPIRED
      - ASSIGNMENT_APPROVED
      - ACK_MISSING_ESCALATION
      - ACK_REQUIRED
      - ASSIGNMENT_SUBMITTED
      - ASSIGNMENT_RETURNED
      - REPLACEMENT_CREATED
      type: string
      description: |-
        * `SUBMISSION_LAGGING` - Отставание по сдаче
        * `SUBMISSION_THRESHOLD_ALERT` - Порог сдачи не достигнут
        * `PILOT_PULSE_DIGEST` - Пульс пилота
        * `GROUP_FORCE_REQUEST_ESCALATED` - Эскалация неотработанного запроса
        * `TEMP_PERMISSION_ACTIVE` - Временное полномочие активно
        * `TEMP_PERMISSION_EXPIRED` - Временное полномочие истекло
        * `ASSIGNMENT_APPROVED` - Расстановка утверждена
        * `ACK_MISSING_ESCALATION` - Ознакомление не получено — эскалация
        * `ACK_REQUIRED` - Требуется ознакомление
        * `ASSIGNMENT_SUBMITTED` - Расстановка подана
        * `ASSIGNMENT_RETURNED` - Расстановка возвращена
        * `REPLACEMENT_CREATED` - Замена в расстановке
