                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/bugreports/:
    get:
      operationId: bugreports_list
      description: Требует bugreports.view (только DEVELOPER-роль по seed_operations)
        — анонимность отправителя от начальства. limit/offset-пагинация (дефолт 50,
        потолок 200).
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - bugreports
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBugReportList'
          description: ''
    post:
      operationId: bugreports_create
      description: «Сообщить о проблеме» — любой аутентифицированный пользователь,
        без RBAC-права.
      tags:
      - bugreports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BugReportCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BugReportCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BugReportCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BugReport'
          description: ''
  /api/bugreports/{id}/:
    get:
      operationId: bugreports_retrieve
      description: Требует bugreports.view — см. list().
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - bugreports
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BugReport'
          description: ''
  /api/bugreports/{id}/resolve/:
    post:
      operationId: bugreports_resolve
      description: Требует bugreports.view — тот же держатель, что list/retrieve (13.4a).
        409 на уже разрешённом репорте.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - bugreports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BugReportResolveRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BugReportResolveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BugReportResolveRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BugReport'
          description: ''
  /api/bugreports/journal/:
    get:
      operationId: bugreports_journal
      description: Публичный журнал «сообщено → исправлено» — любой аутентифицированный
        пользователь (не bugreports.view — см. create). Только разрешённые репорты,
        анонимизированная проекция (id/version/releasedAt/summary — без user_id/screen_path/description).
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - bugreports
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBugReportJournalEntryList'
          description: ''
