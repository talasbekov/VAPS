components:
  schemas:
    ApproveVersionRequest:
      type: object
      description: |-
        Story 16.8d: optional request body for `POST .../approve` —
        literal copy of `apps.operations.statuses.api.serializers.
        BulkStatusCreateSerializer`'s `override`/`override_reason` fields
        (10.2a). No `default=` deliberately (same rationale as that
        serializer): openapi-typescript treats a `default=`'d field as
        always-present in the generated TS type, `required=False` reads as
        optional — matches the field actually being optional here.
      properties:
        override:
          type: boolean
        override_reason:
          type: string
    AssignmentVersion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusD87Enum'
          readOnly: true
        version:
          type: integer
          readOnly: true
          default: 1
        is_current:
          type: boolean
          readOnly: true
        signature_hash:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event
      - id
      - is_current
      - signature_hash
      - status
      - updated_at
      - version
    AssignmentVersionDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusD87Enum'
          readOnly: true
        version:
          type: integer
          readOnly: true
          default: 1
        is_current:
          type: boolean
          readOnly: true
        signature_hash:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/PlacementAssignment'
          readOnly: true
      required:
      - assignments
      - created_at
      - event
      - id
      - is_current
      - signature_hash
      - status
      - updated_at
      - version
    AssignmentVersionReturnResponse:
      type: object
      description: |-
        Story 16.8c: `AssignmentVersionDetailSerializer` (the returned/old
        version) plus `new_draft_version` — the actual response shape returned
        by `AssignmentVersionViewSet.return_`. Exists only so `@extend_schema`
        documents the injected `new_draft_version` key instead of silently
        omitting it (schema.yaml previously understated the real response).
      properties:
        id:
          type: integer
          readOnly: true
        event:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusD87Enum'
          readOnly: true
        version:
          type: integer
          readOnly: true
          default: 1
        is_current:
          type: boolean
          readOnly: true
        signature_hash:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/PlacementAssignment'
          readOnly: true
        new_draft_version:
          allOf:
          - $ref: '#/components/schemas/AssignmentVersion'
          readOnly: true
      required:
      - assignments
      - created_at
      - event
      - id
      - is_current
      - new_draft_version
      - signature_hash
      - status
      - updated_at
      - version
    Attachment:
      type: object
      description: Read-only проекция Attachment — ответ upload (201) и retrieve-форм.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        original_name:
          type: string
          readOnly: true
        content_type:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        sha256:
          type: string
          readOnly: true
