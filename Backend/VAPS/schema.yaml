    IssuedExpenseReport:
      type: object
      description: |-
        Issued расход projection (6.10a) — flat metadata + the attachment ref and
        sha256 for download via 6.7 (X-Accel). The byte file is NOT streamed here.

        Story 10.5b: ``reason`` (модельное поле, "" у v1, непустой у amended) и
        ``supersedes_number``/``supersedes_year`` (номер/год предыдущего
        документа, ``null`` при ``supersedes IS NULL``) — то же имя, что уже
        используется в audit-payload (``document_release_service.py``), теперь
        видимое по API — нужно, чтобы прослеживать цепочку «взамен исх.№ N»
        (журнал, `journal`-роут ниже).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        doc_type:
          type: string
          readOnly: true
        number:
          type: integer
          readOnly: true
        year:
          type: integer
          readOnly: true
        business_date:
          type: string
          format: date
          readOnly: true
        division_id:
          type: string
          format: uuid
          readOnly: true
        submission_id:
          type: integer
          readOnly: true
        submission_version:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/IssuedExpenseReportStatusEnum'
          readOnly: true
        attachment_id:
          type: string
          format: uuid
          readOnly: true
        sha256:
          type: string
          readOnly: true
        reason:
          type: string
          readOnly: true
        supersedes_number:
          type: integer
          nullable: true
          readOnly: true
        supersedes_year:
          type: integer
          nullable: true
          readOnly: true
      required:
      - attachment_id
      - business_date
      - division_id
      - doc_type
      - id
      - number
      - reason
      - sha256
      - status
      - submission_id
      - submission_version
      - supersedes_number
      - supersedes_year
      - year
    IssuedExpenseReportStatusEnum:
      enum:
      - ISSUED
      - SUPERSEDED
      type: string
      description: |-
        * `ISSUED` - Выпущен
