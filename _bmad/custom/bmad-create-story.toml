# Team-оверрайд bmad-create-story для VAPS.
# Мержится поверх {skill-root}/customize.toml резолвером
# _bmad/scripts/resolve_customization.py (массивы — append).
#
# Зачем: правила декомпозиции вынесены в _bmad/custom/decomposition-rules.md,
# но указатель в CLAUDE.md — это нудж, а не гейт. Здесь они (1) грузятся в
# контекст безусловно и (2) получают блокирующую проверку на Step 6.

[workflow]

persistent_facts = [
  "file:{project-root}/_bmad/custom/decomposition-rules.md",
]

activation_steps_append = [
  """
ГЕЙТ ДЕКОМПОЗИЦИИ (VAPS) — обязателен на Step 6 этого воркфлоу.

В Step 6, ДО того как сохранить story-файл и ДО обновления sprint-status.yaml,
прогони созданную стори по загруженным правилам
`_bmad/custom/decomposition-rules.md`:

1. Критерии «A story is too large» — все семь, каждый отдельно.
2. Обязательная структура разделов («Required Structure For Every Story»).
3. Порядок декомпозиции по слоям для затронутой области
   (Backend / API / Frontend / Database).

Выведи результат в чат ПОСТРОЧНО: критерий → PASS/FAIL → чем подтверждён
(число файлов, перечень эндпоинтов, список слоёв). Вердикт без подтверждения
считается FAIL: «выглядит небольшой» — не подтверждение.

Отсутствующая или пустая секция «Files To Create» / «Files To Modify» — это
FAIL, а не N/A: без списка файлов критерий «не более 5 файлов» непроверяем,
и проверка была бы вакуумной.

Если хотя бы один критерий FAIL: НЕ сохраняй story-файл, НЕ меняй
sprint-status.yaml, НЕ ставь статус ready-for-dev. Вместо этого предложи
разбиение на N стори с границами, зависимостями и порядком выполнения — и
HALT, дожидаясь решения пользователя.

Продолжать Step 6 разрешено только когда все критерии PASS.
""",
]
