[pytest]
DJANGO_SETTINGS_MODULE = organization_management.config.settings.test
# 🔴 `tests_*.py` — НЕ ЛИШНИЙ ШАБЛОН, А ПЯТЬ ФАЙЛОВ, КОТОРЫЕ НЕ СОБИРАЛИСЬ
# НИКОГДА (Plane №799).
#
# Прежний список (`tests.py test_*.py *_tests.py`) не покрывал имени вида
# `tests_api.py`: под него подошло бы `*_tests.py`, то есть `api_tests.py`, а
# написано было наоборот. Файлы при этом выглядели как обычные пробы и
# запускались, если указать их путь явно, — поэтому дефект и жил: автор
# проверял свою пробу поимённо и видел зелень, а общий прогон её не гонял.
#
# Замерено на HEAD: шаблону отвечают РОВНО ПЯТЬ файлов — две пробы раздела
# уведомлений (`tests_api.py`, `tests_websockets.py`) и три пробы аудита
# (`tests_api.py`, `tests_middleware.py`, `tests_migration.py`). Ни один из
# них не выполнялся ни в одном гейте. Проба, которую никто не гоняет, хуже
# отсутствующей: она создаёт впечатление покрытия там, где его нет, и её
# нельзя проверить мутацией — её просто не запускают.
#
# ВЫБРАН ШАБЛОН, А НЕ ПЕРЕИМЕНОВАНИЕ (вилка из №799). Переименование в
# `test_*.py` короче и ближе к остальному проекту, но чинит только сегодняшние
# пять файлов: следующий, кто назовёт пробу `tests_<что-то>.py`, получит
# зелёный прогон, ничего не проверив, — а именно так этот дефект и появился
# дважды, в двух разных приложениях. Шаблон закрывает и будущие случаи, и его
# цена измерена: он тянет в сбор ровно эти пять файлов и ничего больше.
python_files = tests.py test_*.py *_tests.py tests_*.py
