<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{margin:0;background:#fff}
    @keyframes sq-dot{0%,80%,100%{opacity:.25;transform:scale(0.7)}40%{opacity:1;transform:scale(1)}}
    @keyframes sq-glow{0%,100%{opacity:.55}50%{opacity:.85}}
  </style>
</helmet>
<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f2f7">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ false }}" hint-size="390,844">
  <div onClick="{{ goNext }}" style="position:relative;width:100%;height:100%;background:linear-gradient(180deg,#ffffff 0%,#f7fbfa 45%,#eaf5f1 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer">

    <div style="position:absolute;top:38%;left:50%;width:340px;height:340px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(45,212,167,0.35) 0%,rgba(45,212,167,0) 70%);filter:blur(20px);animation:sq-glow 4s ease-in-out infinite"></div>

    <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;transform:translateY(-6%)">
      <img src="uploads/logo_smartqoldau.png" alt="SmartQoldau" style="width:120px;height:120px;border-radius:30px;box-shadow:0 24px 60px -12px rgba(15,118,110,0.28),0 2px 8px rgba(15,118,110,0.10)">
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <div style="display:flex;align-items:baseline;gap:8px">
          <div style="font-size:28px;font-weight:800;color:#0f3f3a;letter-spacing:-0.01em">SmartQoldau</div>
          <div style="font-size:15px;font-weight:700;color:#0f766e;letter-spacing:0.02em">Expert</div>
        </div>
        <div style="font-size:14px;font-weight:500;color:#6b8580;letter-spacing:0.01em">Профессиональная платформа для специалистов</div>
      </div>
    </div>

    <div style="position:absolute;bottom:64px;display:flex;gap:10px">
      <div style="width:8px;height:8px;border-radius:50%;background:#0f766e;animation:sq-dot 1.4s ease-in-out infinite;animation-delay:0s"></div>
      <div style="width:8px;height:8px;border-radius:50%;background:#0f766e;animation:sq-dot 1.4s ease-in-out infinite;animation-delay:0.2s"></div>
      <div style="width:8px;height:8px;border-radius:50%;background:#0f766e;animation:sq-dot 1.4s ease-in-out infinite;animation-delay:0.4s"></div>
    </div>
  </div>
</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  renderVals() {
    return { goNext: () => { window.location.href = './SmartQoldau Expert - Онбординг.dc.html'; } };
  }
}

</script>
</body>
</html>
