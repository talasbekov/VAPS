<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{margin:0;background:#fff}
    @keyframes sq-breathe{0%,100%{transform:scale(1);opacity:0.35}50%{transform:scale(1.16);opacity:0.12}}
    @keyframes sq-tip{0%{opacity:0}12%{opacity:1}88%{opacity:1}100%{opacity:0}}
  </style>
</helmet>
<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f2f7">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ true }}" hint-size="390,844">
  <div style="position:relative;width:100%;height:100%;background:linear-gradient(180deg,#0f3f3a 0%,#0a2e2a 100%);display:flex;flex-direction:column;align-items:center;padding:64px 26px 40px;box-sizing:border-box;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden">

    <button onClick="{{ toggleMenu }}" style="position:absolute;top:64px;right:20px;width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">
      <svg width="14" height="4" viewBox="0 0 24 6"><circle cx="3" cy="3" r="2.6" fill="#fff"/><circle cx="12" cy="3" r="2.6" fill="#fff"/><circle cx="21" cy="3" r="2.6" fill="#fff"/></svg>
    </button>

    <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
      <div onClick="{{ toggleMenu }}" style="position:absolute;inset:0;z-index:40"></div>
      <div style="position:absolute;top:100px;right:20px;width:220px;background:#1f3532;border-radius:16px;padding:6px;box-shadow:0 16px 32px -10px rgba(0,0,0,0.4);z-index:41;display:flex;flex-direction:column">
        <div style="padding:11px 12px;font-size:13.5px;font-weight:600;color:#fff;cursor:pointer;border-radius:10px">Сообщить о проблеме</div>
        <div onClick="{{ goToVideo }}" style="padding:11px 12px;font-size:13.5px;font-weight:600;color:#fff;cursor:pointer;border-radius:10px">Переключиться на видео</div>
        <div onClick="{{ goToChat }}" style="padding:11px 12px;font-size:13.5px;font-weight:600;color:#fff;cursor:pointer;border-radius:10px">Написать сообщение</div>
        <div onClick="{{ endCall }}" style="padding:11px 12px;font-size:13.5px;font-weight:600;color:#f0918a;cursor:pointer;border-radius:10px">Завершить консультацию</div>
      </div>
    </sc-if>

    <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px"><span style="width:6px;height:6px;border-radius:50%;background:#2ecc71"></span><span style="font-size:13px;font-weight:600;color:rgba(255,255,255,0.75)">На связи</span></div>
    <div style="font-size:22px;font-weight:800;color:#fff;margin-bottom:48px">{{ timerText }}</div>

    <div style="position:relative;width:180px;height:180px;display:flex;align-items:center;justify-content:center;margin-bottom:32px">
      <div style="position:absolute;inset:0;border-radius:50%;background:rgba(45,212,167,0.3);animation:sq-breathe 5s ease-in-out infinite"></div>
      <img src="assets/psychologist-aigerim.jpg" alt="Динара С." style="width:140px;height:140px;border-radius:50%;object-fit:cover;box-shadow:0 20px 40px -10px rgba(0,0,0,0.35)">
    </div>

    <div style="font-size:20px;font-weight:800;color:#fff;margin-bottom:4px">Динара С.</div>
    <div style="display:flex;align-items:center;gap:5px;margin-bottom:auto"><span style="width:6px;height:6px;border-radius:50%;background:#2ecc71"></span><span style="font-size:13px;font-weight:500;color:rgba(255,255,255,0.6)">Сейчас консультирует</span></div>

    <div style="height:16px;margin-bottom:16px">
      <div key="{{ tipIndex }}" style="font-size:12px;font-weight:500;color:rgba(255,255,255,0.5);text-align:center;animation:sq-tip 7s ease-in-out infinite">{{ tipText }}</div>
    </div>

    <button onClick="{{ goToChat }}" style="display:flex;align-items:center;gap:7px;border:1.5px solid rgba(255,255,255,0.25);border-radius:20px;background:rgba(255,255,255,0.08);color:#fff;font-size:12.5px;font-weight:600;font-family:inherit;padding:8px 16px;cursor:pointer;margin-bottom:20px">
      <span>🤍</span> Мне трудно говорить
    </button>

    <div style="display:flex;align-items:center;gap:20px;margin-bottom:20px">
      <button onClick="{{ toggleMute }}" style="width:60px;height:60px;border-radius:50%;border:none;background:{{ muteBg }};display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 5a3 3 0 016 0v6a3 3 0 01-6 0V5z" stroke="{{ muteColor }}" stroke-width="1.8"/><path d="M5 11a7 7 0 0014 0M12 18v3" stroke="{{ muteColor }}" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button onClick="{{ goToChat }}" style="width:60px;height:60px;border-radius:50%;border:none;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
      <button onClick="{{ endCall }}" style="width:72px;height:72px;border-radius:50%;border:none;background:#e14b3f;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 14px 28px -8px rgba(225,75,63,0.5);padding:0">
        <svg width="25" height="25" viewBox="0 0 24 24" style="display:block;transform:rotate(135deg)">
          <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" fill="#fff"/>
        </svg>
      </button>
      <button onClick="{{ toggleSpeaker }}" style="width:60px;height:60px;border-radius:50%;border:none;background:{{ speakerBg }};display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" stroke="{{ speakerColor }}" stroke-width="1.8" stroke-linejoin="round"/><path d="M17 9a4 4 0 010 6" stroke="{{ speakerColor }}" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div style="display:flex;align-items:center;gap:6px">
      <svg width="12" height="14" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2" stroke="rgba(255,255,255,0.4)" stroke-width="1.8"/><path d="M8 11V7a4 4 0 018 0v4" stroke="rgba(255,255,255,0.4)" stroke-width="1.8"/></svg>
      <div style="font-size:11.5px;font-weight:500;color:rgba(255,255,255,0.4);text-align:center">Консультация защищена. Разговор не записывается</div>
    </div>
  </div>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  static TIPS = [
    'Говорите в своём темпе. Спешить не нужно',
    'Вы можете сделать паузу в любой момент',
    'Если станет тяжело говорить, можно перейти в чат',
  ];
  state = { muted: false, speaker: false, seconds: 8, menuOpen: false, tipIndex: 0 };
  componentDidMount() {
    this._t = setInterval(() => this.setState(s => ({ seconds: s.seconds + 1 })), 1000);
    this._tipT = setInterval(() => this.setState(s => ({ tipIndex: (s.tipIndex + 1) % Component.TIPS.length })), 7000);
  }
  componentWillUnmount() {
    clearInterval(this._t);
    clearInterval(this._tipT);
  }
  renderVals() {
    const m = Math.floor(this.state.seconds / 60);
    const s = this.state.seconds % 60;
    return {
      timerText: `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`,
      tipIndex: this.state.tipIndex,
      tipText: Component.TIPS[this.state.tipIndex],
      menuOpen: this.state.menuOpen,
      muteBg: this.state.muted ? '#fff' : 'rgba(255,255,255,0.12)',
      muteColor: this.state.muted ? '#0f3f3a' : '#fff',
      speakerBg: this.state.speaker ? '#fff' : 'rgba(255,255,255,0.12)',
      speakerColor: this.state.speaker ? '#0f3f3a' : '#fff',
      toggleMute: () => this.setState(s => ({ muted: !s.muted })),
      toggleSpeaker: () => this.setState(s => ({ speaker: !s.speaker })),
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      goToChat: () => { window.location.href = './SmartQoldau - Чат.dc.html'; },
      goToVideo: () => { window.location.href = './SmartQoldau - Видеозвонок.dc.html'; },
      endCall: () => { window.location.href = './SmartQoldau - Оценка.dc.html'; },
    };
  }
}
</script>
</body>
</html>
