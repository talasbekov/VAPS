<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#fff} ::-webkit-scrollbar{display:none}</style>
</helmet>
<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f2f7">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ false }}" hint-size="390,844">
  <div style="position:relative;width:100%;height:100%;background:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden">

    <div style="position:absolute;inset:0;overflow-y:auto;padding:64px 22px 32px;box-sizing:border-box">

      <div style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
        <button onClick="{{ onBack }}" style="width:36px;height:36px;border-radius:50%;border:none;background:rgba(15,118,110,0.07);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0">
          <svg width="10" height="17" viewBox="0 0 10 17" fill="none"><path d="M9 1L1 8.5L9 16" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div style="font-size:19px;font-weight:800;color:#0f3f3a">Способы оплаты</div>
      </div>

      <sc-if value="{{ hasCards }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
          <sc-for list="{{ cards }}" as="c" hint-placeholder-count="1">
            <div style="display:flex;align-items:center;gap:12px;border:1.5px solid #edf2f0;border-radius:16px;padding:14px">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="flex-shrink:0"><rect x="3" y="6" width="18" height="12" rx="2.5" stroke="#0f766e" stroke-width="1.7"/><path d="M3 10h18" stroke="#0f766e" stroke-width="1.7"/></svg>
              <div style="flex:1;min-width:0">
                <div style="font-size:13.5px;font-weight:700;color:#0f3f3a">{{ c.brand }} •••• {{ c.last4 }}</div>
                <div style="font-size:11.5px;font-weight:500;color:#8fa6a1">Действует до {{ c.expiry }}</div>
              </div>
              <div onClick="{{ c.onRemove }}" style="font-size:12px;font-weight:700;color:#c0435f;cursor:pointer;flex-shrink:0">Удалить</div>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{ noCards }}" hint-placeholder-val="{{ true }}">
        <div style="border-radius:18px;border:1.5px dashed #e3f3ee;padding:30px 22px;text-align:center;margin-bottom:20px">
          <div style="font-size:13.5px;font-weight:700;color:#0f3f3a;margin-bottom:5px">Нет привязанных карт</div>
          <div style="font-size:12px;font-weight:500;color:#8fa6a1;line-height:1.5">Привяжите карту, чтобы быстро оплачивать консультации</div>
        </div>
      </sc-if>

      <button onClick="{{ goAddCard }}" style="width:100%;height:52px;border:1.5px solid #0f766e;border-radius:26px;background:#fff;color:#0f766e;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:22px">+ Добавить карту</button>

      <div style="font-size:12px;font-weight:700;color:#8fa6a1;letter-spacing:0.3px;margin-bottom:10px">ДРУГИЕ СПОСОБЫ ОПЛАТЫ</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:#f8faf9">
          <div style="width:36px;height:36px;border-radius:10px;background:#fc3f1d;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:800;color:#fff">K</div>
          <div style="flex:1;font-size:13.5px;font-weight:700;color:#0f3f3a">Kaspi Pay</div>
          <div style="width:14px;height:14px;border-radius:50%;border:2px solid #d8e4e0"></div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:#f8faf9">
          <div style="width:36px;height:36px;border-radius:10px;background:#000;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="16" height="19" viewBox="0 0 16 19" fill="#fff"><path d="M13.1 9.9c0-1.5.7-2.6 2.1-3.5-.8-1.1-2-1.7-3.5-1.8-1.4-.1-2.9.8-3.6.8-.8 0-2.1-.8-3.4-.8-2.5 0-5.1 2.1-5.1 6 0 1.3.2 2.6.7 3.9.6 1.7 2.8 5.9 5.1 5.8 1.2 0 2-.8 3.5-.8 1.5 0 2.3.8 3.6.8 2.3 0 4.3-3.7 4.9-5.4-3.1-1.5-3.3-4.4-3.3-5z"/></svg></div>
          <div style="flex:1;font-size:13.5px;font-weight:700;color:#0f3f3a">Apple Pay</div>
          <div style="width:14px;height:14px;border-radius:50%;border:2px solid #d8e4e0"></div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:#f8faf9">
          <div style="width:36px;height:36px;border-radius:10px;background:#fff;border:1px solid #edf2f0;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.5 29.5 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.5 29.5 4.5 24 4.5c-7.7 0-14.3 4.4-17.7 10.2z"/><path fill="#4CAF50" d="M24 43.5c5.4 0 10.3-1.9 14-5.4l-6.5-5.4c-2 1.4-4.6 2.3-7.5 2.3-5.3 0-9.7-3.1-11.3-7.6l-6.6 5C9.6 39 16.3 43.5 24 43.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.9 2.6-2.7 4.7-5 6.2l6.5 5.4c3.8-3.5 6.2-8.7 6.2-14.6 0-1.2-.1-2.4-.4-3.5z"/></svg></div>
          <div style="flex:1;font-size:13.5px;font-weight:700;color:#0f3f3a">Google Pay</div>
          <div style="width:14px;height:14px;border-radius:50%;border:2px solid #d8e4e0"></div>
        </div>
      </div>
    </div>
  </div>
</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  renderVals() {
    let cards = [];
    try { cards = JSON.parse(localStorage.getItem('sq_cards') || '[]'); } catch (e) {}
    const remove = (idx) => () => {
      const next = cards.filter((_, i) => i !== idx);
      localStorage.setItem('sq_cards', JSON.stringify(next));
      this.forceUpdate();
    };
    const cardsVm = cards.map((c, i) => ({ ...c, onRemove: remove(i) }));
    return {
      cards: cardsVm,
      hasCards: cardsVm.length > 0,
      noCards: cardsVm.length === 0,
      onBack: () => { window.location.href = './SmartQoldau - Профиль.dc.html'; },
      goAddCard: () => { window.location.href = './SmartQoldau - Добавить карту.dc.html'; },
    };
  }
}

</script>
</body>
</html>
