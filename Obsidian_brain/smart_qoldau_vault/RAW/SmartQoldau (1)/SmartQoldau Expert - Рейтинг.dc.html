<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#fff} ::-webkit-scrollbar{display:none} *{scrollbar-width:none}</style>
</helmet>
<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f2f7">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ false }}" hint-size="390,844">
  <div style="position:relative;width:100%;height:100%;background:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden">

    <div style="position:absolute;inset:0;overflow-y:auto;padding:64px 22px 40px;box-sizing:border-box">
      <div onClick="{{ goBack }}" style="width:36px;height:36px;border-radius:50%;background:#f2f2f0;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:22px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#0f3f3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="font-size:21px;font-weight:800;color:#0f3f3a;margin-bottom:22px">Рейтинг и отзывы</div>

      <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:24px">
        <div style="font-size:44px;font-weight:800;color:#0f3f3a;display:flex;align-items:center;gap:8px">4.9 <span style="font-size:28px">⭐</span></div>
        <div style="font-size:12.5px;font-weight:600;color:#8fa6a1;margin-top:4px">247 консультаций</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:28px">
        <sc-for list="{{ breakdown }}" as="b" hint-placeholder-count="5">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="font-size:12px;font-weight:600;color:#8fa6a1;width:38px">{{ b.stars }} ⭐</div>
            <div style="flex:1;height:8px;border-radius:4px;background:#f2f2f0;overflow:hidden"><div style="width:{{ b.pct }};height:100%;background:#0f766e;border-radius:4px"></div></div>
            <div style="font-size:11.5px;font-weight:600;color:#a9bdb9;width:32px;text-align:right">{{ b.count }}</div>
          </div>
        </sc-for>
      </div>

      <div style="font-size:13px;font-weight:700;color:#0f3f3a;margin-bottom:12px">Отзывы клиентов</div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <sc-for list="{{ reviews }}" as="r" hint-placeholder-count="4">
          <div style="border-radius:18px;background:#f8faf9;padding:16px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
              <div style="display:flex;gap:2px">
                <sc-for list="{{ r.stars }}" as="st" hint-placeholder-count="5">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="{{ st.fill }}"><path d="M12 2l3 6.5 7 1-5 5 1.2 7-6.2-3.5-6.2 3.5 1.2-7-5-5 7-1z" stroke="{{ st.fill }}" stroke-width="1"/></svg>
                </sc-for>
              </div>
              <div style="font-size:11px;font-weight:600;color:#a9bdb9">{{ r.date }}</div>
            </div>
            <div style="font-size:13px;font-weight:500;color:#3f5450;line-height:1.5">{{ r.text }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  renderVals() {
    const stars = (n) => Array.from({ length: 5 }, (_, i) => ({ fill: i < n ? '#f2b134' : 'none' }));
    return {
      goBack: () => { window.history.back(); },
      breakdown: [
        { stars: 5, pct: '82%', count: 202 },
        { stars: 4, pct: '12%', count: 30 },
        { stars: 3, pct: '4%', count: 10 },
        { stars: 2, pct: '1%', count: 3 },
        { stars: 1, pct: '1%', count: 2 },
      ],
      reviews: [
        { stars: stars(5), date: '3 авг', text: 'Очень внимательно выслушала и помогла разобраться в чувствах. Спасибо за поддержку' },
        { stars: stars(5), date: '29 июл', text: 'Профессионально и с заботой. Стало легче после первой консультации' },
        { stars: stars(4), date: '22 июл', text: 'Хороший специалист, дал конкретные рекомендации' },
        { stars: stars(5), date: '15 июл', text: 'Чувствовала себя в безопасности во время разговора. Обязательно обращусь снова' },
      ],
    };
  }
}

</script>
</body>
</html>
