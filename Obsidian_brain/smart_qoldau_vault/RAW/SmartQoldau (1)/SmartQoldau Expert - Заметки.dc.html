<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#fff} textarea{outline:none;resize:none;font-family:inherit}</style>
</helmet>
<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f2f7">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ false }}" hint-size="390,844">
  <div style="position:relative;width:100%;height:100%;background:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden">

    <div style="position:absolute;inset:0;padding:64px 22px 40px;box-sizing:border-box;display:flex;flex-direction:column">
      <div onClick="{{ goBack }}" style="width:36px;height:36px;border-radius:50%;background:#f2f2f0;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:22px;flex-shrink:0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#0f3f3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <div style="font-size:20px;font-weight:800;color:#0f3f3a;margin-bottom:6px">Заметки специалиста</div>
      <div style="font-size:13px;font-weight:500;color:#6b8580;line-height:1.5;margin-bottom:20px">Видны только вам. Не используйте медицинские диагнозы</div>

      <textarea value="{{ note }}" onChange="{{ onNoteChange }}" placeholder="Добавьте профессиональные заметки по консультации..." style="flex:1;width:100%;border:1.5px solid #edf2f0;border-radius:18px;padding:16px;font-size:14.5px;color:#0f3f3a;box-sizing:border-box;margin-bottom:16px"></textarea>

      <button onClick="{{ onSave }}" style="width:100%;height:54px;border:none;border-radius:27px;background:#0f766e;color:#fff;font-family:inherit;font-size:15.5px;font-weight:700;cursor:pointer;flex-shrink:0">Сохранить</button>
    </div>

    <sc-if value="{{ showToast }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:20px;right:20px;bottom:40px;background:#0f3f3a;color:#fff;border-radius:14px;padding:13px 16px;font-size:12.5px;font-weight:600;text-align:center;z-index:55">Заметка сохранена</div>
    </sc-if>
  </div>
</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  state = { note: '', showToast: false };
  renderVals() {
    return {
      note: this.state.note,
      onNoteChange: (e) => this.setState({ note: e.target.value }),
      goBack: () => { window.location.href = './SmartQoldau Expert - Главная.dc.html'; },
      showToast: this.state.showToast,
      onSave: () => {
        this.setState({ showToast: true });
        setTimeout(() => { window.location.href = './SmartQoldau Expert - Главная.dc.html'; }, 900);
      },
    };
  }
}

</script>
</body>
</html>
