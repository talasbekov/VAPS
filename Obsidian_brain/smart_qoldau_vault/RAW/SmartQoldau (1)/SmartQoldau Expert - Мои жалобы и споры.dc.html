<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#fff} ::-webkit-scrollbar{display:none} *{scrollbar-width:none}</style>
</helmet>
<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f2f7">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ false }}" hint-size="390,844">
  <div style="position:relative;width:100%;height:100%;background:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden">

    <div style="position:absolute;inset:0;overflow-y:auto;padding:64px 22px 32px;box-sizing:border-box">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
        <button onClick="{{ onBack }}" style="width:36px;height:36px;border-radius:50%;border:none;background:rgba(15,118,110,0.07);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0">
          <svg width="10" height="17" viewBox="0 0 10 17" fill="none"><path d="M9 1L1 8.5L9 16" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div style="font-size:19px;font-weight:800;color:#0f3f3a">Жалобы и споры</div>
      </div>

      <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:10px">
          <sc-for list="{{ complaints }}" as="c" hint-placeholder-count="3">
            <div onClick="{{ c.onClick }}" style="border-radius:16px;background:#f8faf9;padding:14px;cursor:pointer">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
                <div style="font-size:13.5px;font-weight:700;color:#0f3f3a">{{ c.reason }}</div>
                <div style="display:inline-flex;padding:3px 9px;border-radius:9px;background:{{ c.statusBg }};font-size:10.5px;font-weight:700;color:{{ c.statusColor }}">{{ c.statusLabel }}</div>
              </div>
              <div style="font-size:11.5px;font-weight:500;color:#8fa6a1;margin-bottom:4px">Клиент {{ c.clientId }} · {{ c.date }}</div>
              <sc-if value="{{ c.outcome }}" hint-placeholder-val="{{ false }}"><div style="font-size:12px;font-weight:700;color:#0f3f3a">{{ c.outcome }}</div></sc-if>
            </div>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ !hasItems }}" hint-placeholder-val="{{ false }}">
        <div style="text-align:center;padding:40px 20px;color:#8fa6a1;font-size:13px;font-weight:500">На вас пока не подавали жалоб</div>
      </sc-if>
    </div>
  </div>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  static COMPLAINTS = [
    { id: 1, clientId: '#1048', reason: 'Специалист опоздал на 20 минут', date: '2 сент', status: 'pending', outcome: '' },
    { id: 2, clientId: '#1052', reason: 'Спор по no-show', date: '1 сент', status: 'confirmed', outcome: 'Подтверждена — страйк' },
    { id: 3, clientId: '#1091', reason: 'Клиент вёл себя агрессивно', date: '30 авг', status: 'rejected', outcome: 'Жалоба отклонена' },
  ];
  renderVals() {
    const STATUS = {
      pending: { label: 'На рассмотрении', bg: '#fdf3e3', color: '#c98a2e' },
      confirmed: { label: 'Подтверждена', bg: '#fdedec', color: '#c0392b' },
      rejected: { label: 'Отклонена', bg: '#f2f2f0', color: '#6b8580' },
    };
    const complaints = Component.COMPLAINTS.map(c => ({ ...c, statusLabel: STATUS[c.status].label, statusBg: STATUS[c.status].bg, statusColor: STATUS[c.status].color, onClick: () => { if (c.status === 'pending') window.location.href = './SmartQoldau Expert - Жалоба на вас.dc.html'; } }));
    return {
      complaints,
      hasItems: complaints.length > 0,
      onBack: () => window.history.back(),
    };
  }
}
</script>
</body>
</html>
