<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#fff} ::-webkit-scrollbar{display:none} *{scrollbar-width:none}</style>
</helmet>
<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f2f7">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ false }}" hint-size="390,844">
  <div style="position:relative;width:100%;height:100%;background:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden">

    <div style="position:absolute;inset:0;overflow-y:auto;padding:64px 22px 40px;box-sizing:border-box">
      <div onClick="{{ goBack }}" style="width:36px;height:36px;border-radius:50%;background:#f2f2f0;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:22px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#0f3f3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="font-size:21px;font-weight:800;color:#0f3f3a;margin-bottom:20px">Выплаты</div>

      <div style="border-radius:20px;background:#0f3f3a;padding:20px;margin-bottom:22px">
        <div style="font-size:12px;font-weight:600;color:rgba(255,255,255,0.55);margin-bottom:8px">Доступно к выводу</div>
        <div style="font-size:26px;font-weight:800;color:#fff;margin-bottom:16px">125 400 ₸</div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,0.1)">
          <div style="display:flex;align-items:center;gap:8px">
            <svg width="18" height="14" viewBox="0 0 24 18" fill="none"><rect x="1" y="1" width="22" height="16" rx="2.5" stroke="#fff" stroke-width="1.4"/><rect x="1" y="5" width="22" height="3" fill="#fff"/></svg>
            <div style="font-size:12.5px;font-weight:700;color:#fff">**** 4521</div>
          </div>
          <div style="font-size:11.5px;font-weight:700;color:#7fd6c2;cursor:pointer">Изменить</div>
        </div>
      </div>

      <button onClick="{{ onWithdraw }}" style="width:100%;height:54px;border:none;border-radius:27px;background:#0f766e;color:#fff;font-family:inherit;font-size:15.5px;font-weight:700;cursor:pointer;margin-bottom:26px">Вывести средства</button>

      <div style="font-size:13px;font-weight:700;color:#0f3f3a;margin-bottom:12px">История выплат</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <sc-for list="{{ payouts }}" as="p" hint-placeholder-count="4">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:16px;border:1px solid #edf2f0">
            <div>
              <div style="font-size:13.5px;font-weight:800;color:#0f3f3a">{{ p.amount }}</div>
              <div style="font-size:11.5px;font-weight:500;color:#8fa6a1;margin-top:2px">{{ p.date }}</div>
            </div>
            <div style="font-size:11px;font-weight:700;color:{{ p.color }};padding:6px 11px;border-radius:10px;background:{{ p.bg }}">{{ p.status }}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <sc-if value="{{ showToast }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:20px;right:20px;bottom:40px;background:#0f3f3a;color:#fff;border-radius:14px;padding:13px 16px;font-size:12.5px;font-weight:600;text-align:center;z-index:55">Заявка на вывод отправлена</div>
    </sc-if>
  </div>
</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  state = { showToast: false };
  renderVals() {
    return {
      goBack: () => { window.history.back(); },
      showToast: this.state.showToast,
      onWithdraw: () => { this.setState({ showToast: true }); setTimeout(() => this.setState({ showToast: false }), 2200); },
      payouts: [
        { amount: '75 000 ₸', date: '5 авг', status: 'Обрабатывается', color: '#c98a2e', bg: '#fdf3e3' },
        { amount: '48 500 ₸', date: '28 июл', status: 'Выплачено', color: '#159a7c', bg: '#e3f3ee' },
        { amount: '62 000 ₸', date: '21 июл', status: 'Выплачено', color: '#159a7c', bg: '#e3f3ee' },
        { amount: '30 000 ₸', date: '14 июл', status: 'Отклонено', color: '#c0392b', bg: '#fdece3' },
      ],
    };
  }
}

</script>
</body>
</html>
