<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#fff} ::-webkit-scrollbar{display:none} *{scrollbar-width:none}</style>
</helmet>
<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f2f7">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ false }}" hint-size="390,844">
  <div style="position:relative;width:100%;height:100%;background:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden">

    <div style="position:absolute;inset:0;overflow-y:auto;padding:64px 22px 110px;box-sizing:border-box">

      <div style="margin-bottom:20px">
        <div style="font-size:21px;font-weight:800;color:#0f3f3a;margin-bottom:6px">Избранное</div>
        <div style="font-size:13px;font-weight:500;color:#6b8580;line-height:1.5">Специалисты, с которыми вам было комфортно</div>
      </div>

      <sc-if value="{{ hasFavorites }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:12px">
          <sc-for list="{{ favorites }}" as="f" hint-placeholder-count="4">
            <div style="border-radius:20px;border:1px solid #edf2f0;padding:16px;display:flex;flex-direction:column;gap:12px">
              <div style="display:flex;align-items:flex-start;gap:12px">
                <div style="width:50px;height:50px;border-radius:50%;background:{{ f.bg }};display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;font-weight:800;color:{{ f.color }}">{{ f.initial }}</div>
                <div style="flex:1;min-width:0">
                  <div style="font-size:14.5px;font-weight:800;color:#0f3f3a">{{ f.name }}</div>
                  <div style="font-size:12px;font-weight:500;color:#8fa6a1">{{ f.role }}</div>
                  <div style="display:flex;align-items:center;gap:4px;margin-top:3px;white-space:nowrap">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="#f5a623" style="flex-shrink:0"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.7 1.6 6.8L12 17l-6.2 3.5 1.6-6.8-5.2-4.7 6.9-.7L12 2z"/></svg>
                    <span style="font-size:11.5px;font-weight:700;color:#0f3f3a">{{ f.rating }}</span>
                    <span style="font-size:11px;font-weight:500;color:#a9bdb9;white-space:nowrap">· {{ f.lastDate }}</span>
                  </div>
                </div>
                <div onClick="{{ f.onToggle }}" style="width:34px;height:34px;border-radius:50%;background:rgba(192,67,95,0.08);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="#c0435f"><path d="M12 21s-8-5-8-11.5A4.5 4.5 0 0112 5a4.5 4.5 0 018 3.5C20 15 12 20 12 20z"/></svg>
                </div>
              </div>
              <div style="display:flex;gap:8px">
                <button onClick="{{ f.onBook }}" style="flex:1;height:42px;border:none;border-radius:14px;background:#0f766e;color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer">Записаться снова</button>
                <button onClick="{{ f.onProfile }}" style="height:42px;padding:0 16px;border:1.5px solid #edf2f0;border-radius:14px;background:#fff;color:#0f3f3a;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer">Профиль</button>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{ noFavorites }}" hint-placeholder-val="{{ false }}">
        <div style="border-radius:20px;border:1.5px dashed #e3f3ee;padding:34px 24px;text-align:center;margin-top:8px">
          <div style="font-size:13.5px;font-weight:700;color:#0f3f3a;margin-bottom:6px">Пока нет избранных специалистов</div>
          <div style="font-size:12px;font-weight:500;color:#8fa6a1;line-height:1.5">После консультации вы сможете добавить психолога в избранное, чтобы быстро записаться снова</div>
        </div>
      </sc-if>
    </div>

    <div style="position:absolute;left:0;right:0;bottom:0;height:88px;background:#fff;display:flex;padding-top:12px;border-top:1px solid #eef2f0;box-sizing:border-box;z-index:30">
      <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="5">
        <div onClick="{{ n.onClick }}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="{{ n.icon }}" stroke="{{ n.color }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div style="font-size:10.5px;font-weight:700;color:{{ n.color }}">{{ n.label }}</div>
        </div>
      </sc-for>
    </div>
  </div>
</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  static ALL = [
    { id: 1, initial: 'Д', name: 'Дана Ержанова', role: 'Психолог, тревога и стресс', rating: '4.9', lastDate: '2 авг', bg: '#e6f0fb', color: '#3b82c4' },
    { id: 2, initial: 'А', name: 'Айгуль Сатпаева', role: 'Психолог, КПТ-терапия', rating: '4.9', lastDate: '19 июл', bg: '#e3f3ee', color: '#159a7c' },
    { id: 3, initial: 'М', name: 'Марат Абенов', role: 'Психолог, выгорание', rating: '4.7', lastDate: '27 июл', bg: '#f1eafb', color: '#8b5fc9' },
  ];
  state = { removed: [] };
  renderVals() {
    const s = this.state;
    const visible = Component.ALL.filter(f => !s.removed.includes(f.id));
    const favorites = visible.map(f => ({
      ...f,
      onToggle: () => this.setState(st => ({ removed: [...st.removed, f.id] })),
      onBook: () => { window.location.href = './SmartQoldau - Специалист найден.dc.html'; },
      onProfile: () => { window.location.href = './SmartQoldau - Профиль психолога.dc.html'; },
    }));
    const nav = (active) => [
      { label: 'Главная', icon: 'M4 11.5L12 4l8 7.5M6 10v9h5v-5h2v5h5v-9', href: './SmartQoldau - Главная.dc.html' },
      { label: 'Консультации', icon: 'M4 5h16v11H8l-4 4V5z', href: './SmartQoldau - Консультации.dc.html' },
      { label: 'Избранное', icon: 'M12 21s-8-5-8-11.5A4.5 4.5 0 0112 5a4.5 4.5 0 018 3.5C20 15 12 20 12 20z', href: './SmartQoldau - Избранное.dc.html' },
      { label: 'Материалы', icon: 'M12 21c0-6-4-9-8-9 0 6 4 9 8 9z M12 21c0-9 4-14 8-15 1 8-3 14-8 15z', href: './SmartQoldau - Материалы.dc.html' },
      { label: 'Профиль', icon: 'M12 12a4 4 0 100-8 4 4 0 000 8z M4 20c0-4 3.6-7 8-7s8 3 8 7', href: './SmartQoldau - Профиль.dc.html' },
    ].map(n => ({ ...n, color: n.label === active ? '#0f766e' : '#a9bdb9', onClick: n.label === active ? () => {} : () => { window.location.href = n.href; } }));
    return {
      hasFavorites: favorites.length > 0,
      noFavorites: favorites.length === 0,
      favorites,
      navItems: nav('Избранное'),
    };
  }
}

</script>
</body>
</html>
