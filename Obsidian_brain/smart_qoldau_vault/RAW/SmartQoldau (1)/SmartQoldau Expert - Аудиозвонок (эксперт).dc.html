<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#fff} @keyframes sq-ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.55);opacity:0}}</style>
</helmet>
<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f2f7">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ true }}" hint-size="390,844">
  <div style="position:relative;width:100%;height:100%;background:linear-gradient(180deg,#0f3f3a 0%,#0a2b27 100%);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden">

    <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;background:rgba(10,20,18,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px;box-sizing:border-box;z-index:60;text-align:center">
        <div style="width:60px;height:60px;border-radius:50%;background:rgba(240,145,138,0.15);display:flex;align-items:center;justify-content:center;margin-bottom:20px">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M2 8.5a15 15 0 0120 0M5.5 12a10.5 10.5 0 0113 0M9 15.5a6 6 0 016 0M12 19v.1" stroke="#f0918a" stroke-width="1.8" stroke-linecap="round"/><path d="M3 3l18 18" stroke="#f0918a" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <div style="font-size:17px;font-weight:800;color:#fff;margin-bottom:8px">Соединение потеряно</div>
        <div style="font-size:13px;font-weight:500;color:rgba(255,255,255,0.6);line-height:1.5;margin-bottom:26px">Проверьте подключение к интернету. Клиент останется на линии ещё немного.</div>
        <button onClick="{{ onReconnect }}" style="width:100%;height:52px;border:none;border-radius:26px;background:#0f766e;color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:10px">Переподключиться</button>
        <button onClick="{{ endCall }}" style="width:100%;height:46px;border:1.5px solid rgba(255,255,255,0.25);border-radius:23px;background:transparent;color:#fff;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer">Завершить звонок</button>
      </div>
    </sc-if>

    <div style="position:absolute;top:64px;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px">
      <div style="display:flex;flex-direction:column;gap:3px">
        <div style="font-size:15px;font-weight:800;color:#fff">Консультация</div>
        <div style="font-size:11.5px;font-weight:600;color:rgba(255,255,255,0.55)">{{ timerText }}</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.12);border-radius:16px;height:30px;padding:0 12px">
        <span style="width:6px;height:6px;border-radius:50%;background:{{ qualityColor }}"></span>
        <span style="font-size:11px;font-weight:700;color:#fff">{{ qualityLabel }}</span>
      </div>
    </div>

    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div style="position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:22px">
        <div style="position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,255,255,0.25);animation:sq-ring 2.6s ease-out infinite"></div>
        <div style="width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2 M12 11a4 4 0 100-8 4 4 0 000 8z" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div style="font-size:19px;font-weight:800;color:#fff;margin-bottom:6px">Анонимный клиент #3067</div>
      <div style="font-size:13px;font-weight:500;color:rgba(255,255,255,0.55)">Тревожность · Аудиоконсультация</div>
    </div>

    <div style="position:absolute;bottom:0;left:0;right:0;padding:0 26px 40px;display:flex;flex-direction:column;align-items:center;gap:18px">
      <div style="font-size:11.5px;font-weight:500;color:rgba(255,255,255,0.5)">🔒 Разговор защищён шифрованием и не записывается</div>
      <div style="display:flex;align-items:center;gap:18px">
        <button onClick="{{ toggleMute }}" style="width:56px;height:56px;border-radius:50%;border:none;background:{{ muteBg }};display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 5a3 3 0 016 0v6a3 3 0 01-6 0V5z" stroke="{{ muteColor }}" stroke-width="1.8"/><path d="M5 11a7 7 0 0014 0M12 18v3" stroke="{{ muteColor }}" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button onClick="{{ endCall }}" style="width:68px;height:68px;border-radius:50%;border:none;background:#e14b3f;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 14px 28px -8px rgba(225,75,63,0.5);padding:0">
          <svg width="24" height="24" viewBox="0 0 24 24" style="display:block;transform:rotate(135deg)"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" fill="#fff"/></svg>
        </button>
        <button onClick="{{ toggleSpeaker }}" style="width:56px;height:56px;border-radius:50%;border:none;background:{{ speakerBg }};display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" stroke="{{ speakerColor }}" stroke-width="1.8" stroke-linejoin="round"/><path d="M17 9a4 4 0 010 6" stroke="{{ speakerColor }}" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </div>
</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  state = { muted: false, speaker: false, seconds: 12, showError: !navigator.onLine };
  componentDidMount() {
    this._t = setInterval(() => { if (!this.state.showError) this.setState(s => ({ seconds: s.seconds + 1 })); }, 1000);
    this._offline = () => this.setState({ showError: true });
    window.addEventListener('offline', this._offline);
  }
  componentWillUnmount() { clearInterval(this._t); window.removeEventListener('offline', this._offline); }
  renderVals() {
    const s = this.state;
    const m = Math.floor(s.seconds / 60), sec = s.seconds % 60;
    const unstable = s.seconds > 0 && s.seconds % 40 < 4;
    return {
      timerText: `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`,
      qualityColor: unstable ? '#f2b134' : '#2ecc71',
      qualityLabel: unstable ? 'Соединение нестабильно' : 'Хорошее соединение',
      showError: s.showError,
      onReconnect: () => this.setState({ showError: false }),
      muteBg: s.muted ? '#fff' : 'rgba(255,255,255,0.15)',
      muteColor: s.muted ? '#0f3f3a' : '#fff',
      speakerBg: s.speaker ? '#fff' : 'rgba(255,255,255,0.15)',
      speakerColor: s.speaker ? '#0f3f3a' : '#fff',
      toggleMute: () => this.setState(s2 => ({ muted: !s2.muted })),
      toggleSpeaker: () => this.setState(s2 => ({ speaker: !s2.speaker })),
      endCall: () => { window.location.href = './SmartQoldau Expert - Завершение.dc.html?format=audio'; },
    };
  }
}

</script>
</body>
</html>
