<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif} a{color:#0f766e} a:hover{color:#0a5951}</style>
</helmet>
<div style="width:100%;background:#fff;min-height:100vh">

  <div style="position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);border-bottom:1px solid #eef2f0">
    <div style="max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 32px;gap:24px">
      <a href="./SmartQoldau.kz.dc.html" style="display:flex;align-items:center;gap:9px;flex-shrink:0;text-decoration:none">
        <img src="uploads/logo_smartqoldau.png" alt="SmartQoldau" style="width:32px;height:32px;border-radius:9px">
        <div style="font-size:16px;font-weight:800;color:#0f3f3a">SmartQoldau</div>
      </a>
      <a href="./SmartQoldau.kz.dc.html" style="font-size:13px;font-weight:700;color:#0f3f3a;text-decoration:none">← На главную</a>
    </div>
  </div>

  <div style="background:#f7faf9;padding:48px 32px 40px;text-align:center">
    <sc-if value="{{ specialistName }}" hint-placeholder-val="{{ false }}">
      <div style="display:inline-flex;align-items:center;gap:10px;border-radius:16px;background:#fff;border:1px solid #d9ede7;padding:12px 20px;margin-bottom:22px">
        <div style="font-size:13.5px;font-weight:700;color:#0f766e">Вы записываетесь к специалисту: {{ specialistName }}</div>
      </div>
    </sc-if>
    <div style="font-size:32px;font-weight:800;color:#0f3f3a;margin-bottom:10px">Что вас сейчас беспокоит?</div>
    <div style="font-size:15px;font-weight:500;color:#6b8580">Выберите тему — мы поможем найти подходящего специалиста</div>
  </div>

  <div style="max-width:920px;margin:0 auto;padding:48px 32px 90px">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:52px">
      <sc-for list="{{ topics }}" as="t" hint-placeholder-count="11">
        <div onClick="{{ t.onClick }}" style="border:1.5px solid {{ t.borderColor }};background:{{ t.bg }};border-radius:18px;padding:22px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:border-color 0.2s ease,background 0.2s ease">
          <div style="width:42px;height:42px;border-radius:13px;background:{{ t.iconBg }};display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="{{ t.icon }}" stroke="{{ t.iconColor }}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div style="font-size:14.5px;font-weight:700;color:#0f3f3a;text-align:left">{{ t.label }}</div>
        </div>
      </sc-for>
    </div>

    <div style="font-size:17px;font-weight:800;color:#0f3f3a;margin-bottom:16px">Выберите формат консультации</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:44px">
      <sc-for list="{{ formats }}" as="f" hint-placeholder-count="3">
        <div onClick="{{ f.onClick }}" style="border:1.5px solid {{ f.borderColor }};background:{{ f.bg }};border-radius:18px;padding:26px 16px;cursor:pointer;text-align:center;transition:border-color 0.2s ease,background 0.2s ease">
          <div style="width:48px;height:48px;border-radius:14px;background:{{ f.iconBg }};display:flex;align-items:center;justify-content:center;margin:0 auto 12px">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="{{ f.icon }}" stroke="{{ f.iconColor }}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div style="font-size:14px;font-weight:700;color:#0f3f3a">{{ f.label }}</div>
        </div>
      </sc-for>
    </div>

    <button onClick="{{ onContinue }}" disabled="{{ !canContinue }}" style="width:100%;height:56px;border:none;border-radius:28px;background:{{ canContinue ? 'linear-gradient(135deg,#159a7c,#0f766e)' : '#e3e9e7' }};box-shadow:{{ canContinue ? '0 14px 30px -10px rgba(15,118,110,0.5)' : 'none' }};color:{{ canContinue ? '#fff' : '#a9bdb9' }};font-family:inherit;font-size:15.5px;font-weight:700;cursor:{{ canContinue ? 'pointer' : 'default' }};transition:background 0.25s ease,color 0.25s ease,transform 0.15s ease,box-shadow 0.25s ease" style-hover="{{ canContinue ? 'transform:translateY(-2px);box-shadow:0 18px 36px -10px rgba(15,118,110,0.6)' : '' }}">Подобрать специалиста</button>
  </div>

  <div style="background:#0f3f3a;padding:30px 32px;text-align:center;font-size:12px;font-weight:500;color:rgba(255,255,255,0.4)">© SmartQoldau</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  state = { topic: null, format: null };
  componentDidMount() {
    const f = new URLSearchParams(window.location.search).get('format');
    if (f) this.setState({ format: f });
  }
  renderVals() {
    const s = this.state;
    const specialistParam = new URLSearchParams(window.location.search).get('specialist');
    const params = new URLSearchParams(window.location.search);
    const specialistName = params.get('specialist');
    const topicChoice = (label, icon, iconBg, iconColor) => ({ label, icon, iconBg, iconColor, borderColor: s.topic === label ? '#0f766e' : '#eef2f0', bg: s.topic === label ? '#f2fbf8' : '#fff', onClick: () => this.setState({ topic: label }) });
    const formatDef = (id, label, icon, iconBg, iconColor) => ({ id, label, icon, iconBg, iconColor, borderColor: s.format === id ? '#0f766e' : '#eef2f0', bg: s.format === id ? '#f2fbf8' : '#fff', onClick: () => this.setState({ format: id }) });
    return {
      specialistName,
      topics: [
        ['Тревога и стресс', 'M12 21a9 9 0 100-18 9 9 0 000 18z M12 7v5l3.5 2', '#e3f3ee', '#159a7c'],
        ['Отношения', 'M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 10-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z', '#fdece3', '#e08a4d'],
        ['Семья', 'M18 21a4 4 0 00-4-4h-4a4 4 0 00-4 4 M12 13a4 4 0 100-8 4 4 0 000 8z M22 21a3.5 3.5 0 00-3-3.5 M2 21a3.5 3.5 0 013-3.5 M17 8.5a2.5 2.5 0 100-5M7 8.5a2.5 2.5 0 110-5', '#e6f0fb', '#3b82c4'],
        ['Эмоциональное выгорание', 'M8.5 14.5A2.5 2.5 0 0011 12c0-1.4-1.5-2-1.5-3.5A2.5 2.5 0 0112 6c1 3 4 4 4 8a4 4 0 01-8 0c0-1 .3-1.8.5-2.5z', '#fdece3', '#e08a4d'],
        ['Самооценка', 'M12 2l3 6.5 7 1-5 5 1.2 7-6.2-3.5-6.2 3.5 1.2-7-5-5 7-1z', '#f1eafb', '#8b5fc9'],
        ['Панические состояния', 'M13 2L4 14h6l-1 8 9-12h-6l1-8z', '#fdece3', '#e08a4d'],
        ['Зависимости', 'M9 2v6.5L4.5 17a3 3 0 002.6 4.5h9.8a3 3 0 002.6-4.5L15 8.5V2 M9 2h6', '#f1eafb', '#8b5fc9'],
        ['Жизненные кризисы', 'M12 8v5M12 16v.1 M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z', '#fdece3', '#c0392b'],
        ['Одиночество', 'M12 12a4 4 0 100-8 4 4 0 000 8z M5 20c0-3.5 3-6 7-6s7 2.5 7 6', '#e6f0fb', '#3b82c4'],
        ['Проблемы со сном', 'M21 12.8A9 9 0 1111.2 3a7 7 0 109.8 9.8z', '#f1eafb', '#8b5fc9'],
        ['Другое', 'M12 8v.1M11 12h1v5h1 M12 21a9 9 0 100-18 9 9 0 000 18z', '#e3f3ee', '#159a7c'],
      ].map(t => topicChoice(t[0], t[1], t[2], t[3])),
      formats: [
        formatDef('chat', 'Чат', 'M4 5h16v11H8l-4 4V5z', '#e3f3ee', '#159a7c'),
        formatDef('audio', 'Аудио', 'M12 1a4 4 0 00-4 4v6a4 4 0 008 0V5a4 4 0 00-4-4z M5 11a7 7 0 0014 0M12 18v3', '#e6f0fb', '#3b82c4'),
        formatDef('video', 'Видео', 'M23 7l-7 5 7 5V7z M14 5H3a2 2 0 00-2 2v10a2 2 0 002 2h11a2 2 0 002-2V7a2 2 0 00-2-2z', '#fdece3', '#e08a4d'),
      ],
      canContinue: !!(s.topic && s.format),
      onContinue: () => { window.location.href = `./SmartQoldau Web - Поиск специалиста.dc.html?topic=${encodeURIComponent(s.topic)}&format=${s.format}${specialistParam ? '&specialist=' + encodeURIComponent(specialistParam) : ''}`; },
    };
  }
}

</script>
</body>
</html>
