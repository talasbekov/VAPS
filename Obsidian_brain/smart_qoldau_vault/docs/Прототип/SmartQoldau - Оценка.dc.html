<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#fff} textarea{outline:none} @keyframes sq-fade{0%{opacity:0}100%{opacity:1}}</style>
</helmet>
<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f2f7">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ false }}" hint-size="390,844">
  <div style="position:relative;width:100%;height:100%;background:#fff;display:flex;flex-direction:column;align-items:center;padding:72px 26px 32px;box-sizing:border-box;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden">

    <button onClick="{{ goHome }}" style="position:absolute;top:64px;left:24px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(15,118,110,0.07);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">
      <svg width="10" height="17" viewBox="0 0 10 17" fill="none"><path d="M9 1L1 8.5L9 16" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button onClick="{{ onFinish }}" style="position:absolute;top:64px;right:24px;font-size:13px;font-weight:700;color:#8fa6a1;background:none;border:none;cursor:pointer;padding:0">Пропустить</button>

    <div style="width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin-top:36px;margin-bottom:20px">
      <div style="font-size:21px;font-weight:800;color:#0f3f3a;line-height:1.3">Спасибо, что доверяете<br>SmartQoldau 💚</div>
    </div>

    <div style="width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#f7fbfa;margin-bottom:18px">
      <img src="assets/psychologist-aigerim.jpg" alt="Динара С." style="width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0">
      <div>
        <div style="font-size:14px;font-weight:700;color:#0f3f3a">Динара С.</div>
        <div style="font-size:11.5px;font-weight:500;color:#8fa6a1">Аудиоконсультация · 8 мин</div>
      </div>
    </div>

    <div style="font-size:14px;font-weight:600;color:#3a5450;margin-bottom:12px">Как прошла консультация?</div>

    <div style="display:flex;gap:8px;margin-bottom:10px">
      <sc-for list="{{ stars }}" as="st" hint-placeholder-count="5">
        <div onClick="{{ st.onClick }}" style="cursor:pointer">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="{{ st.fill }}"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.7 1.6 6.8L12 17l-6.2 3.5 1.6-6.8-5.2-4.7 6.9-.7L12 2z" stroke="{{ st.stroke }}" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </div>
      </sc-for>
    </div>

    <div style="height:18px;margin-bottom:10px;font-size:13px;font-weight:700;color:#0f766e">{{ ratingLabel }}</div>

    <sc-if value="{{ showTags }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px">
        <sc-for list="{{ tags }}" as="t" hint-placeholder-count="3">
          <div onClick="{{ t.onClick }}" style="padding:8px 13px;border-radius:16px;border:1.5px solid {{ t.borderColor }};background:{{ t.bg }};color:{{ t.color }};font-size:12.5px;font-weight:600;cursor:pointer">{{ t.label }}</div>
        </sc-for>
      </div>
    </sc-if>

    <textarea value="{{ feedback }}" onChange="{{ onFeedbackChange }}" placeholder="Ваш отзыв (необязательно)" style="width:100%;height:96px;border-radius:16px;border:1.5px solid #e6efec;background:#fafcfb;padding:14px;font-size:14px;font-family:inherit;color:#0f3f3a;resize:none;box-sizing:border-box;margin-bottom:10px"></textarea>

    <div style="font-size:11px;font-weight:500;color:#a9bdb9;text-align:center;line-height:1.4;margin-bottom:18px">Отзыв видит только команда качества SmartQoldau — психолог его не увидит</div>

    <button onClick="{{ onFinish }}" style="width:100%;height:54px;border:none;border-radius:27px;background:#0f766e;color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 12px 24px -8px rgba(15,118,110,0.4);margin-bottom:14px">Завершить</button>

    <button onClick="{{ onContinueSame }}" style="width:100%;height:48px;border:1.5px solid #e6efec;border-radius:24px;background:#fff;color:#0f3f3a;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer">Продолжить с тем же психологом</button>

    <sc-if value="{{ showThanks }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;animation:sq-fade 0.3s ease-out">
        <div style="width:64px;height:64px;border-radius:50%;background:#0f766e;display:flex;align-items:center;justify-content:center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div style="font-size:18px;font-weight:800;color:#0f3f3a">Спасибо за отзыв!</div>
        <div style="font-size:13px;font-weight:500;color:#8fa6a1">Он поможет нам стать лучше</div>
      </div>
    </sc-if>
  </div>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { rating: 5, feedback: '', selectedTags: [], showThanks: false };
  toggleTag(label) {
    this.setState(s => ({
      selectedTags: s.selectedTags.includes(label) ? s.selectedTags.filter(t => t !== label) : [...s.selectedTags, label],
    }));
  }
  renderVals() {
    const rate = (n) => () => this.setState({ rating: n, selectedTags: [] });
    const stars = [1, 2, 3, 4, 5].map(n => ({
      onClick: rate(n),
      fill: n <= this.state.rating ? '#f5a623' : 'none',
      stroke: n <= this.state.rating ? '#f5a623' : '#c9d6d2',
    }));
    const labels = { 1: 'Плохо', 2: 'Ниже среднего', 3: 'Нормально', 4: 'Хорошо', 5: 'Отлично' };
    const tagsByRating = {
      1: ['Не помогло', 'Долгое ожидание', 'Плохая связь'],
      2: ['Мало пользы', 'Не понял меня', 'Технические проблемы'],
      3: ['Средне', 'Могло быть лучше', 'Стандартно'],
      4: ['Внимательный', 'Помог разобраться', 'Профессионально'],
      5: ['Внимательный', 'Помог разобраться', 'Превзошёл ожидания'],
    };
    const tagLabels = tagsByRating[this.state.rating] || [];
    const tags = tagLabels.map(label => {
      const on = this.state.selectedTags.includes(label);
      return {
        label,
        onClick: () => this.toggleTag(label),
        bg: on ? '#0f766e' : '#fff',
        color: on ? '#fff' : '#0f3f3a',
        borderColor: on ? '#0f766e' : '#e6efec',
      };
    });
    return {
      stars,
      ratingLabel: labels[this.state.rating] || '',
      showTags: true,
      tags,
      showThanks: this.state.showThanks,
      feedback: this.state.feedback,
      onFeedbackChange: (e) => this.setState({ feedback: e.target.value }),
      onFinish: () => {
        this.setState({ showThanks: true });
        setTimeout(() => { window.location.href = './SmartQoldau - Главная.dc.html'; }, 1300);
      },
      onContinueSame: () => { window.history.back(); },
      goHome: () => { window.location.href = './SmartQoldau - Главная.dc.html'; },
    };
  }
}
</script>
</body>
</html>
