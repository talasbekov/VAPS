<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#fff} ::-webkit-scrollbar{display:none} *{scrollbar-width:none}</style>
</helmet>
<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f2f7">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ false }}" hint-size="390,844">
  <div style="position:relative;width:100%;height:100%;background:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden">

    <div style="position:absolute;inset:0;overflow-y:auto;padding:64px 22px 110px;box-sizing:border-box">
      <div style="font-size:21px;font-weight:800;color:#0f3f3a;margin-bottom:18px">Заявки</div>

      <div style="display:flex;gap:6px;background:#f2f2f0;border-radius:14px;padding:4px;margin-bottom:20px">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
          <div onClick="{{ t.onClick }}" style="flex:1;text-align:center;padding:9px 4px;border-radius:11px;background:{{ t.selected ? '#fff' : 'transparent' }};box-shadow:{{ t.selected ? '0 2px 6px rgba(0,0,0,0.08)' : 'none' }};font-size:12.5px;font-weight:700;color:{{ t.selected ? '#0f3f3a' : '#8fa6a1' }};cursor:pointer">{{ t.label }}</div>
        </sc-for>
      </div>

      <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:12px">
          <sc-for list="{{ items }}" as="r" hint-placeholder-count="3">
            <div onClick="{{ r.onClick }}" style="border:1.5px solid {{ r.borderColor }};background:{{ r.bg }};border-radius:20px;padding:16px;cursor:pointer">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
                <div style="display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:10px;background:#fff">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="{{ r.formatIcon }}" stroke="#0f766e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  <div style="font-size:11px;font-weight:700;color:#0f766e">{{ r.format }}</div>
                </div>
                <div style="font-size:11px;font-weight:600;color:#8fa6a1">{{ r.time }}</div>
              </div>
              <div style="font-size:14px;font-weight:800;color:#0f3f3a;margin-bottom:2px">Анонимный клиент #7284</div>
              <div style="font-size:12px;font-weight:500;color:#6b8580;margin-bottom:12px">Тема: {{ r.topic }} · {{ r.price }}</div>
              <sc-if value="{{ r.showActions }}" hint-placeholder-val="{{ false }}">
                <div style="display:flex;gap:8px">
                  <button onClick="{{ r.onAccept }}" style="flex:1;height:44px;border:none;border-radius:14px;background:#0f766e;color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer">Принять</button>
                  <button onClick="{{ r.onDecline }}" style="flex:1;height:44px;border:1.5px solid #f5d9df;border-radius:14px;background:#fff;color:#c0435f;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer">Отклонить</button>
                </div>
              </sc-if>
              <sc-if value="{{ r.statusLabel }}" hint-placeholder-val="{{ false }}">
                <div style="font-size:11.5px;font-weight:700;color:{{ r.statusColor }}">{{ r.statusLabel }}</div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ noItems }}" hint-placeholder-val="{{ false }}">
        <div style="text-align:center;padding:60px 20px">
          <div style="font-size:14px;font-weight:700;color:#0f3f3a;margin-bottom:4px">{{ emptyTitle }}</div>
          <div style="font-size:12.5px;font-weight:500;color:#8fa6a1">{{ emptySubtitle }}</div>
        </div>
      </sc-if>
    </div>

    <div style="position:absolute;left:0;right:0;bottom:0;height:88px;background:#fff;display:flex;padding-top:12px;border-top:1px solid #eef2f0;box-sizing:border-box;z-index:30">
      <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="5">
        <div onClick="{{ n.onClick }}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="{{ n.icon }}" stroke="{{ n.color }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div style="font-size:10.5px;font-weight:700;color:{{ n.color }}">{{ n.label }}</div>
        </div>
      </sc-for>
    </div>
  </div>
</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  static ALL = [
    { id: 1, status: 'new', formatId: 'chat', topic: 'Тревожность', format: 'Чат', formatIcon: 'M4 5h16v11H8l-4 4V5z', time: 'Сейчас', price: '3 990 ₸' },
    { id: 2, status: 'new', formatId: 'video', topic: 'Панические атаки', format: 'Видео', formatIcon: 'M23 7l-7 5 7 5V7z M14 5H3a2 2 0 00-2 2v10a2 2 0 002 2h11a2 2 0 002-2V7a2 2 0 00-2-2z', time: '2 мин назад', price: '4 990 ₸' },
    { id: 3, status: 'accepted', formatId: 'audio', topic: 'Выгорание', format: 'Аудио', formatIcon: 'M12 1a4 4 0 00-4 4v6a4 4 0 008 0V5a4 4 0 00-4-4z M5 11a7 7 0 0014 0M12 18v3', time: 'Сегодня, 19:00', price: '3 990 ₸' },
    { id: 4, status: 'completed', formatId: 'video', topic: 'Отношения и семья', format: 'Видео', formatIcon: 'M23 7l-7 5 7 5V7z M14 5H3a2 2 0 00-2 2v10a2 2 0 002 2h11a2 2 0 002-2V7a2 2 0 00-2-2z', time: '2 авг', price: '4 990 ₸' },
  ];
  state = { tab: 'new', declined: [] };
  renderVals() {
    const s = this.state;
    const tabDefs = [
      { id: 'new', label: 'Новые' },
      { id: 'accepted', label: 'Принятые' },
      { id: 'completed', label: 'Завершённые' },
    ].map(t => ({ ...t, selected: s.tab === t.id, onClick: () => this.setState({ tab: t.id }) }));

    const filtered = Component.ALL.filter(r => r.status === s.tab && !s.declined.includes(r.id));
    const items = filtered.map(r => ({
      ...r,
      borderColor: r.status === 'new' ? '#e3f3ee' : '#edf2f0',
      bg: r.status === 'new' ? '#f2fbf8' : '#fff',
      showActions: r.status === 'new',
      statusLabel: r.status === 'accepted' ? 'Ожидает начала консультации' : r.status === 'completed' ? 'Консультация проведена' : '',
      statusColor: r.status === 'accepted' ? '#0f766e' : '#8fa6a1',
      onClick: () => { window.location.href = './SmartQoldau Expert - Заявка.dc.html?id=' + r.id + '&format=' + r.formatId + (r.status === 'new' ? '' : '&status=' + r.status); },
      onAccept: (e) => { window.location.href = './SmartQoldau Expert - Заявка.dc.html?id=' + r.id + '&format=' + r.formatId + '&status=accepted'; },
      onDecline: (e) => { this.setState({ declined: [...s.declined, r.id] }); },
    }));

    const emptyMap = {
      new: { title: 'Нет новых заявок', subtitle: 'Новые обращения появятся здесь' },
      accepted: { title: 'Нет принятых заявок', subtitle: 'Принятые заявки станут консультациями в расписании' },
      completed: { title: 'Пока нет завершённых заявок', subtitle: 'История появится после первой консультации' },
    };

    const nav = (active) => [
      { label: 'Главная', icon: 'M4 11.5L12 4l8 7.5M6 10v9h5v-5h2v5h5v-9', href: './SmartQoldau Expert - Главная.dc.html' },
      { label: 'Заявки', icon: 'M14 3v4a1 1 0 001 1h4 M6 2h8l6 6v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2z', href: './SmartQoldau Expert - Заявки.dc.html' },
      { label: 'Консультации', icon: 'M4 5h16v11H8l-4 4V5z', href: './SmartQoldau Expert - Консультации.dc.html' },
      { label: 'Доход', icon: 'M2 7h20v13H2z M2 7l3-4h14l3 4 M2 12h20', href: './SmartQoldau Expert - Доход.dc.html' },
      { label: 'Профиль', icon: 'M12 12a4 4 0 100-8 4 4 0 000 8z M4 20c0-4 3.6-7 8-7s8 3 8 7', href: './SmartQoldau Expert - Профиль.dc.html' },
    ].map(n => ({ ...n, color: n.label === active ? '#0f766e' : '#a9bdb9', onClick: n.label === active ? () => {} : () => { window.location.href = n.href; } }));

    return {
      tabs: tabDefs,
      hasItems: items.length > 0,
      noItems: items.length === 0,
      items,
      emptyTitle: emptyMap[s.tab].title,
      emptySubtitle: emptyMap[s.tab].subtitle,
      navItems: nav('Заявки'),
    };
  }
}

</script>
</body>
</html>
