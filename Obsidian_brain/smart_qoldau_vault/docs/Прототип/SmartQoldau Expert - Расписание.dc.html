<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#fff} ::-webkit-scrollbar{display:none} *{scrollbar-width:none}</style>
</helmet>
<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f2f7">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ false }}" hint-size="390,844">
  <div style="position:relative;width:100%;height:100%;background:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden">

    <div style="position:absolute;inset:0;overflow-y:auto;padding:64px 22px 40px;box-sizing:border-box">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
        <div style="font-size:21px;font-weight:800;color:#0f3f3a">Расписание</div>
        <div onClick="{{ goAvailability }}" style="font-size:12.5px;font-weight:700;color:#0f766e;cursor:pointer">Настроить</div>
      </div>

      <div style="display:flex;gap:6px;background:#f2f2f0;border-radius:14px;padding:4px;margin-bottom:22px">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
          <div onClick="{{ t.onClick }}" style="flex:1;text-align:center;padding:9px 4px;border-radius:11px;background:{{ t.selected ? '#fff' : 'transparent' }};box-shadow:{{ t.selected ? '0 2px 6px rgba(0,0,0,0.08)' : 'none' }};font-size:12.5px;font-weight:700;color:{{ t.selected ? '#0f3f3a' : '#8fa6a1' }};cursor:pointer">{{ t.label }}</div>
        </sc-for>
      </div>

      <div style="display:flex;flex-direction:column;gap:2px">
        <sc-for list="{{ slots }}" as="h" hint-placeholder-count="10">
          <div style="display:flex;gap:14px;min-height:52px">
            <div style="width:44px;flex-shrink:0;font-size:11.5px;font-weight:600;color:#a9bdb9;padding-top:2px">{{ h.label }}</div>
            <div style="flex:1;border-top:1px solid #f2f2f0;padding-top:2px;padding-bottom:8px">
              <sc-if value="{{ h.booking }}" hint-placeholder-val="{{ false }}">
                <div onClick="{{ h.onClick }}" style="border-radius:12px;background:{{ h.bg }};padding:9px 12px;cursor:pointer">
                  <div style="font-size:12.5px;font-weight:800;color:{{ h.color }}">{{ h.title }}</div>
                  <div style="font-size:11px;font-weight:500;color:{{ h.color }};opacity:0.75">{{ h.subtitle }}</div>
                </div>
              </sc-if>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="position:absolute;left:0;right:0;bottom:0;height:88px;background:#fff;display:flex;padding-top:12px;border-top:1px solid #eef2f0;box-sizing:border-box;z-index:30">
      <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="5">
        <div onClick="{{ n.onClick }}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="{{ n.icon }}" stroke="{{ n.color }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div style="font-size:10.5px;font-weight:700;color:{{ n.color }}">{{ n.label }}</div>
        </div>
      </sc-for>
    </div>
  </div>
</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  static HOURS = ['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'];
  static BOOKINGS = { '11:00': { title: 'Анонимный клиент #2214', subtitle: 'Тревожность · Чат', bg: '#e3f3ee', color: '#159a7c' }, '19:00': null, '15:00': { title: 'Анонимный пользователь', subtitle: 'Выгорание · Аудио', bg: '#e6f0fb', color: '#3b82c4' } };
  state = { tab: 'today' };
  renderVals() {
    const s = this.state;
    const tabDefs = [
      { id: 'today', label: 'Сегодня' },
      { id: 'tomorrow', label: 'Завтра' },
      { id: 'week', label: 'Неделя' },
    ].map(t => ({ ...t, selected: s.tab === t.id, onClick: () => this.setState({ tab: t.id }) }));

    const slots = Component.HOURS.map(h => {
      const b = Component.BOOKINGS[h];
      return { label: h, booking: !!b, title: b?.title, subtitle: b?.subtitle, bg: b?.bg, color: b?.color, onClick: () => { window.location.href = './SmartQoldau Expert - Консультация.dc.html'; } };
    });

    const nav = (active) => [
      { label: 'Главная', icon: 'M4 11.5L12 4l8 7.5M6 10v9h5v-5h2v5h5v-9', href: './SmartQoldau Expert - Главная.dc.html' },
      { label: 'Заявки', icon: 'M14 3v4a1 1 0 001 1h4 M6 2h8l6 6v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2z', href: './SmartQoldau Expert - Заявки.dc.html' },
      { label: 'Консультации', icon: 'M4 5h16v11H8l-4 4V5z', href: './SmartQoldau Expert - Консультации.dc.html' },
      { label: 'Доход', icon: 'M2 7h20v13H2z M2 7l3-4h14l3 4 M2 12h20', href: './SmartQoldau Expert - Доход.dc.html' },
      { label: 'Профиль', icon: 'M12 12a4 4 0 100-8 4 4 0 000 8z M4 20c0-4 3.6-7 8-7s8 3 8 7', href: './SmartQoldau Expert - Профиль.dc.html' },
    ].map(n => ({ ...n, color: n.label === active ? '#0f766e' : '#a9bdb9', onClick: n.label === active ? () => {} : () => { window.location.href = n.href; } }));

    return {
      tabs: tabDefs,
      slots,
      goAvailability: () => { window.location.href = './SmartQoldau Expert - Доступность.dc.html'; },
      navItems: nav('Консультации'),
    };
  }
}

</script>
</body>
</html>
