<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#fff} ::-webkit-scrollbar{display:none} *{scrollbar-width:none}</style>
</helmet>
<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f2f7">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ false }}" hint-size="390,844">
  <div style="position:relative;width:100%;height:100%;background:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden">

    <div style="position:absolute;inset:0;overflow-y:auto;padding:64px 22px 40px;box-sizing:border-box">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
        <div onClick="{{ goBack }}" style="width:36px;height:36px;border-radius:50%;background:#f2f2f0;display:flex;align-items:center;justify-content:center;cursor:pointer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#0f3f3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div style="font-size:21px;font-weight:800;color:#0f3f3a">Центр поддержки</div>
      </div>
      <div style="font-size:13px;font-weight:500;color:#6b8580;line-height:1.5;margin:12px 4px 22px">Выберите категорию вопроса — мы ответим в течение рабочего дня</div>

      <div style="display:flex;flex-direction:column;gap:10px">
        <sc-for list="{{ topics }}" as="t" hint-placeholder-count="5">
          <div onClick="{{ t.onClick }}" style="display:flex;align-items:center;gap:14px;border:1px solid #edf2f0;border-radius:18px;padding:16px;cursor:pointer">
            <div style="width:44px;height:44px;border-radius:13px;background:{{ t.bg }};display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="{{ t.icon }}" stroke="{{ t.color }}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div style="flex:1;font-size:14px;font-weight:700;color:#0f3f3a">{{ t.label }}</div>
            <svg width="8" height="13" viewBox="0 0 9 14" fill="none"><path d="M1 1l6 6-6 6" stroke="#c4d3cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </sc-for>
      </div>

      <button onClick="{{ onContact }}" style="width:100%;height:54px;border:none;border-radius:27px;background:#0f766e;color:#fff;font-family:inherit;font-size:15.5px;font-weight:700;cursor:pointer;margin-top:26px">Связаться с поддержкой</button>
    </div>
  </div>
</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  renderVals() {
    return {
      goBack: () => { window.history.back(); },
      topics: [
        { label: 'FAQ', bg: '#e3f3ee', color: '#159a7c', icon: 'M9.5 9a2.5 2.5 0 015 0c0 1.5-2.5 2-2.5 3.5M12 17v.1 M12 21a9 9 0 100-18 9 9 0 000 18z' },
        { label: 'Техническая проблема', bg: '#e6f0fb', color: '#3b82c4', icon: 'M10.5 20.5l3-3M14.5 14.5l4.5 4.5M12 2l1 5-4 1 3 3-3 5 5-2 1 4 2-4 4 2-3-5 3-3-4-1 1-5-3 2z' },
        { label: 'Вопрос по выплатам', bg: '#fdece3', color: '#e08a4d', icon: 'M2 7h20v13H2z M2 7l3-4h14l3 4 M2 12h20' },
        { label: 'Вопрос по клиенту', bg: '#f1eafb', color: '#8b5fc9', icon: 'M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2 M12 11a4 4 0 100-8 4 4 0 000 8z' },
        { label: 'Верификация', bg: '#f2f2f0', color: '#0f3f3a', icon: 'M9 12l2 2 4-4M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z' },
      ].map(t => ({ ...t, onClick: () => {} })),
      onContact: () => {},
    };
  }
}

</script>
</body>
</html>
