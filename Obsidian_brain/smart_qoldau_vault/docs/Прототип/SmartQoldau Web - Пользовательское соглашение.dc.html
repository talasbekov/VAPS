<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif} a{color:#0f766e}</style>
</helmet>
<div style="width:100%;background:#fff;min-height:100vh">
  <div style="position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);border-bottom:1px solid #eef2f0">
    <div style="max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 32px">
      <a href="./SmartQoldau.kz.dc.html" style="display:flex;align-items:center;gap:9px;text-decoration:none"><img src="uploads/logo_smartqoldau.png" style="width:30px;height:30px;border-radius:8px"><div style="font-size:15px;font-weight:800;color:#0f3f3a">SmartQoldau</div></a>
      <a href="./SmartQoldau.kz.dc.html" style="font-size:13px;font-weight:700;color:#0f3f3a;text-decoration:none">← На главную</a>
    </div>
  </div>
  <div style="max-width:720px;margin:0 auto;padding:56px 32px 90px">
    <div style="font-size:28px;font-weight:800;color:#0f3f3a;margin-bottom:6px">Пользовательское соглашение</div>
    <div style="font-size:12.5px;font-weight:600;color:#a9bdb9;margin-bottom:36px">Действует с 1 августа 2026 года</div>
    <div style="display:flex;flex-direction:column;gap:28px">
      <sc-for list="{{ sections }}" as="s" hint-placeholder-count="6">
        <div><div style="font-size:16px;font-weight:800;color:#0f3f3a;margin-bottom:8px">{{ s.title }}</div><div style="font-size:14px;font-weight:500;color:#5b7a75;line-height:1.7">{{ s.text }}</div></div>
      </sc-for>
    </div>
  </div>
  <div style="background:#0f3f3a;padding:30px 32px;text-align:center;font-size:12px;font-weight:500;color:rgba(255,255,255,0.4)">© SmartQoldau</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  renderVals() {
    return {
      sections: [
        { title: '1. Общие положения', text: 'SmartQoldau — платформа, соединяющая пользователей с психологами для консультаций в чате, по аудио- и видеосвязи. Используя платформу, вы соглашаетесь с условиями настоящего соглашения.' },
        { title: '2. SmartQoldau не заменяет экстренные службы', text: 'Платформа не является медицинской или экстренной службой. При угрозе жизни или здоровью необходимо немедленно обращаться в экстренные службы: 102 (полиция), 103 (скорая помощь).' },
        { title: '3. Ответственность специалистов', text: 'Консультации проводятся специалистами, прошедшими проверку квалификации на платформе. Ответственность за содержание консультации несёт специалист в рамках своей профессиональной практики.' },
        { title: '4. Оплата консультаций', text: 'Стоимость консультации указывается в профиле специалиста до начала обращения. Подписка Premium не включает оплату отдельных консультаций.' },
        { title: '5. Анонимный режим', text: 'Пользователь может обратиться без раскрытия личных данных. Анонимный режим ограничивает часть функций, включая сохранение истории между устройствами.' },
        { title: '6. Изменение условий', text: 'SmartQoldau может обновлять условия соглашения. Об изменениях, влияющих на права пользователей, мы сообщаем заранее.' },
      ],
    };
  }
}

</script>
</body>
</html>
