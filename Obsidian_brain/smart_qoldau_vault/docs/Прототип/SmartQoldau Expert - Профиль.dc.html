<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#fff} ::-webkit-scrollbar{display:none} *{scrollbar-width:none}</style>
</helmet>
<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f2f7">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ false }}" hint-size="390,844">
  <div style="position:relative;width:100%;height:100%;background:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden">

    <div style="position:absolute;inset:0;overflow-y:auto;padding:64px 22px 140px;box-sizing:border-box">
      <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:22px">
        <div style="width:84px;height:84px;border-radius:50%;background:#e3f3ee;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#159a7c;margin-bottom:12px">А</div>
        <div style="font-size:18px;font-weight:800;color:#0f3f3a">Айгуль Сатпаева</div>
        <div onClick="{{ goVerification }}" style="display:flex;align-items:center;gap:6px;margin-top:8px;padding:6px 14px;border-radius:14px;background:#0f766e;cursor:pointer">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M9 12l2 2 4-4M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div style="font-size:11px;font-weight:700;color:#fff">Верифицированный специалист</div>
        </div>
      </div>

      <div style="display:flex;gap:10px;margin-bottom:22px">
        <div style="flex:1;border-radius:16px;background:#f8faf9;padding:14px;text-align:center"><div style="font-size:18px;font-weight:800;color:#0f3f3a">4.9 ⭐</div><div style="font-size:10.5px;font-weight:600;color:#8fa6a1;margin-top:2px">рейтинг</div></div>
        <div style="flex:1;border-radius:16px;background:#f8faf9;padding:14px;text-align:center"><div style="font-size:18px;font-weight:800;color:#0f3f3a">247</div><div style="font-size:10.5px;font-weight:600;color:#8fa6a1;margin-top:2px">консультации</div></div>
        <div style="flex:1;border-radius:16px;background:#f8faf9;padding:14px;text-align:center"><div style="font-size:18px;font-weight:800;color:#0f3f3a">3 990 ₸</div><div style="font-size:10.5px;font-weight:600;color:#8fa6a1;margin-top:2px">за сессию</div></div>
      </div>

      <div style="display:flex;flex-direction:column;gap:2px">
        <sc-for list="{{ menuItems }}" as="m" hint-placeholder-count="8">
          <div onClick="{{ m.onClick }}" style="display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid #f2f2f0;cursor:pointer">
            <div style="width:36px;height:36px;border-radius:11px;background:#f2f2f0;display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="{{ m.icon }}" stroke="#0f3f3a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div style="flex:1;font-size:14px;font-weight:600;color:#0f3f3a">{{ m.label }}</div>
            <svg width="8" height="13" viewBox="0 0 9 14" fill="none"><path d="M1 1l6 6-6 6" stroke="#c4d3cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </sc-for>
      </div>

      <button onClick="{{ onLogout }}" style="width:100%;height:50px;border:none;background:transparent;color:#c0392b;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:20px">Выйти из аккаунта</button>
    </div>

    <div style="position:absolute;left:0;right:0;bottom:0;height:88px;background:#fff;display:flex;padding-top:12px;border-top:1px solid #eef2f0;box-sizing:border-box;z-index:30">
      <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="5">
        <div onClick="{{ n.onClick }}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="{{ n.icon }}" stroke="{{ n.color }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div style="font-size:10.5px;font-weight:700;color:{{ n.color }}">{{ n.label }}</div>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{ showLogoutModal }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;background:rgba(15,40,37,0.45);display:flex;align-items:center;justify-content:center;padding:28px;box-sizing:border-box;z-index:50">
        <div style="width:100%;background:#fff;border-radius:24px;padding:26px 22px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px">
          <div style="font-size:17px;font-weight:800;color:#0f3f3a">Выйти из аккаунта?</div>
          <div style="font-size:13px;font-weight:500;color:#6b8580;line-height:1.5">Вы сможете войти снова в любой момент</div>
          <button onClick="{{ confirmLogout }}" style="width:100%;height:50px;border:none;border-radius:25px;background:#fbe7ec;color:#c0435f;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:12px">Выйти</button>
          <button onClick="{{ cancelLogout }}" style="width:100%;height:50px;border:none;border-radius:25px;background:#0f766e;color:#fff;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer">Остаться</button>
        </div>
      </div>
    </sc-if>
  </div>
</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

</script>
</body>
</html>
