<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#fff} ::-webkit-scrollbar{display:none} *{scrollbar-width:none}</style>
</helmet>
<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f2f7">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ false }}" hint-size="390,844">
  <div style="position:relative;width:100%;height:100%;background:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden">

    <div onClick="{{ skip }}" style="position:absolute;top:56px;right:22px;font-size:13px;font-weight:600;color:#8fa6a1;cursor:pointer;z-index:5">Пропустить</div>

    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px;box-sizing:border-box">
      <div style="width:180px;height:180px;border-radius:44px;background:{{ slide.bg }};display:flex;align-items:center;justify-content:center;margin-bottom:40px">
        <svg width="76" height="76" viewBox="0 0 24 24" fill="none"><path d="{{ slide.icon }}" stroke="{{ slide.color }}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="font-size:23px;font-weight:800;color:#0f3f3a;text-align:center;margin-bottom:12px;line-height:1.3">{{ slide.title }}</div>
      <div style="font-size:14.5px;font-weight:500;color:#6b8580;text-align:center;line-height:1.6;max-width:280px">{{ slide.desc }}</div>
    </div>

    <div style="position:absolute;left:0;right:0;bottom:0;padding:0 22px 40px;box-sizing:border-box">
      <div style="display:flex;justify-content:center;gap:7px;margin-bottom:24px">
        <sc-for list="{{ dots }}" as="d" hint-placeholder-count="4">
          <div style="width:{{ d.active ? '20px' : '7px' }};height:7px;border-radius:4px;background:{{ d.active ? '#0f766e' : '#e3e9e7' }};transition:all 0.2s"></div>
        </sc-for>
      </div>
      <button onClick="{{ onNext }}" style="width:100%;height:54px;border:none;border-radius:27px;background:#0f766e;color:#fff;font-family:inherit;font-size:15.5px;font-weight:700;cursor:pointer">{{ nextLabel }}</button>
    </div>
  </div>
</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  static SLIDES = [
    { title: 'Получайте клиентов', desc: 'Заявки на консультации приходят напрямую от людей, которым нужна поддержка', bg: '#e3f3ee', color: '#159a7c', icon: 'M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2 M9 11a4 4 0 100-8 4 4 0 000 8z M23 21v-2a4 4 0 00-3-3.87 M16 3.13a4 4 0 010 7.75' },
    { title: 'Проводите консультации онлайн', desc: 'Чат, аудио- и видеозвонки — выбирайте формат, который удобен вам и клиенту', bg: '#e6f0fb', color: '#3b82c4', icon: 'M23 7l-7 5 7 5V7z M14 5H3a2 2 0 00-2 2v10a2 2 0 002 2h11a2 2 0 002-2V7a2 2 0 00-2-2z' },
    { title: 'Управляйте своим расписанием', desc: 'Сами решаете, когда вы онлайн и готовы принимать обращения', bg: '#fdece3', color: '#e08a4d', icon: 'M8 2v4M16 2v4M3 10h18 M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z' },
    { title: 'Получайте выплаты через платформу', desc: 'Прозрачный расчёт дохода и вывод средств на карту в несколько нажатий', bg: '#f1eafb', color: '#8b5fc9', icon: 'M2 7h20v13H2z M2 7l3-4h14l3 4 M2 12h20' },
  ];
  state = { i: 0 };
  renderVals() {
    const s = Component.SLIDES[this.state.i];
    const last = this.state.i === Component.SLIDES.length - 1;
    return {
      slide: s,
      dots: Component.SLIDES.map((_, idx) => ({ active: idx === this.state.i })),
      nextLabel: last ? 'Начать' : 'Далее',
      skip: () => { window.location.href = './SmartQoldau Expert - Добро пожаловать.dc.html'; },
      onNext: () => {
        if (last) { window.location.href = './SmartQoldau Expert - Добро пожаловать.dc.html'; }
        else { this.setState({ i: this.state.i + 1 }); }
      },
    };
  }
}

</script>
</body>
</html>
