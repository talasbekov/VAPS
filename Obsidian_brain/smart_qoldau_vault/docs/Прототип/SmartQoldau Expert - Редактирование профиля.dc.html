<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#fff} ::-webkit-scrollbar{display:none} *{scrollbar-width:none} input,select{outline:none;font-family:inherit}</style>
</helmet>
<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f2f7">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ false }}" hint-size="390,844">
  <div style="position:relative;width:100%;height:100%;background:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden">

    <div style="position:absolute;inset:0;overflow-y:auto;padding:64px 22px 40px;box-sizing:border-box">
      <div onClick="{{ goBack }}" style="width:36px;height:36px;border-radius:50%;background:#f2f2f0;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:22px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#0f3f3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="font-size:21px;font-weight:800;color:#0f3f3a;margin-bottom:22px">Редактировать профиль</div>

      <div style="display:flex;justify-content:center;margin-bottom:24px">
        <div style="width:84px;height:84px;border-radius:50%;background:#e3f3ee;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#159a7c;position:relative;cursor:pointer">
          А
          <div style="position:absolute;bottom:-4px;right:-4px;width:28px;height:28px;border-radius:50%;background:#0f766e;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M4 15V19a2 2 0 002 2h12a2 2 0 002-2v-4M17 8l-5-5-5 5M12 3v13" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
      </div>

      <div style="display:flex;gap:10px;margin-bottom:14px">
        <div style="flex:1"><div style="font-size:12px;font-weight:700;color:#0f3f3a;margin-bottom:7px">Имя</div><input value="{{ firstName }}" onInput="{{ onFirstName }}" style="width:100%;height:50px;border:1.5px solid #edf2f0;border-radius:14px;padding:0 14px;font-size:14px;color:#0f3f3a;box-sizing:border-box"/></div>
        <div style="flex:1"><div style="font-size:12px;font-weight:700;color:#0f3f3a;margin-bottom:7px">Фамилия</div><input value="{{ lastName }}" onInput="{{ onLastName }}" style="width:100%;height:50px;border:1.5px solid #edf2f0;border-radius:14px;padding:0 14px;font-size:14px;color:#0f3f3a;box-sizing:border-box"/></div>
      </div>

      <div style="margin-bottom:14px"><div style="font-size:12px;font-weight:700;color:#0f3f3a;margin-bottom:7px">Образование</div><input value="{{ education }}" onInput="{{ onEducation }}" style="width:100%;height:50px;border:1.5px solid #edf2f0;border-radius:14px;padding:0 14px;font-size:14px;color:#0f3f3a;box-sizing:border-box"/></div>

      <div style="display:flex;gap:10px;margin-bottom:14px">
        <div style="flex:1"><div style="font-size:12px;font-weight:700;color:#0f3f3a;margin-bottom:7px">Опыт работы</div>
          <select value="{{ experience }}" onChange="{{ onExperience }}" style="width:100%;height:50px;border:1.5px solid #edf2f0;border-radius:14px;padding:0 12px;font-size:14px;color:#0f3f3a;box-sizing:border-box;background:#fff">
            <sc-for list="{{ experienceOptions }}" as="e" hint-placeholder-count="5"><option value="{{ e }}">{{ e }}</option></sc-for>
          </select>
        </div>
        <div style="flex:1"><div style="font-size:12px;font-weight:700;color:#0f3f3a;margin-bottom:7px">Стоимость, ₸</div><input value="{{ price }}" onInput="{{ onPrice }}" inputmode="numeric" style="width:100%;height:50px;border:1.5px solid #edf2f0;border-radius:14px;padding:0 14px;font-size:14px;color:#0f3f3a;box-sizing:border-box"/></div>
      </div>

      <div style="font-size:12px;font-weight:700;color:#0f3f3a;margin-bottom:9px">Специализация</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">
        <sc-for list="{{ specializations }}" as="sp" hint-placeholder-count="9">
          <div onClick="{{ sp.onClick }}" style="padding:9px 14px;border-radius:14px;background:{{ sp.selected ? '#0f766e' : '#f2f2f0' }};color:{{ sp.selected ? '#fff' : '#0f3f3a' }};font-size:12.5px;font-weight:700;cursor:pointer">{{ sp.label }}</div>
        </sc-for>
      </div>

      <div style="font-size:12px;font-weight:700;color:#0f3f3a;margin-bottom:9px">Форматы консультаций</div>
      <div style="display:flex;gap:8px;margin-bottom:26px">
        <sc-for list="{{ formats }}" as="f" hint-placeholder-count="3">
          <div onClick="{{ f.onClick }}" style="flex:1;padding:12px 8px;border-radius:14px;background:{{ f.selected ? '#e3f3ee' : '#f8faf9' }};border:1.5px solid {{ f.selected ? '#0f766e' : 'transparent' }};display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="{{ f.icon }}" stroke="{{ f.selected ? '#0f766e' : '#8fa6a1' }}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div style="font-size:11.5px;font-weight:700;color:{{ f.selected ? '#0f766e' : '#8fa6a1' }}">{{ f.label }}</div>
          </div>
        </sc-for>
      </div>

      <button onClick="{{ onSave }}" style="width:100%;height:54px;border:none;border-radius:27px;background:#0f766e;color:#fff;font-family:inherit;font-size:15.5px;font-weight:700;cursor:pointer">Сохранить изменения</button>
    </div>

    <sc-if value="{{ showToast }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:20px;right:20px;bottom:40px;background:#0f3f3a;color:#fff;border-radius:14px;padding:13px 16px;font-size:12.5px;font-weight:600;text-align:center;z-index:55">Профиль обновлён</div>
    </sc-if>
  </div>
</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  static SPECS = ['Тревожность', 'Стресс', 'Отношения', 'Семейные проблемы', 'Эмоциональное выгорание', 'Зависимости', 'Самооценка', 'Кризисные ситуации', 'Другое'];
  static FORMATS = [
    { id: 'chat', label: 'Чат', icon: 'M4 5h16v11H8l-4 4V5z' },
    { id: 'audio', label: 'Аудио', icon: 'M12 1a4 4 0 00-4 4v6a4 4 0 008 0V5a4 4 0 00-4-4z M5 11a7 7 0 0014 0M12 18v3' },
    { id: 'video', label: 'Видео', icon: 'M23 7l-7 5 7 5V7z M14 5H3a2 2 0 00-2 2v10a2 2 0 002 2h11a2 2 0 002-2V7a2 2 0 00-2-2z' },
  ];
  state = { firstName: 'Айгуль', lastName: 'Сатпаева', education: 'КазНУ им. Аль-Фараби, психология', experience: '5-10 лет', price: '3990', selectedSpecs: ['Тревожность', 'Стресс', 'Кризисные ситуации'], selectedFormats: ['chat', 'audio', 'video'], showToast: false };
  toggle(list, id) { return list.includes(id) ? list.filter(x => x !== id) : [...list, id]; }
  renderVals() {
    const s = this.state;
    return {
      firstName: s.firstName, onFirstName: (e) => this.setState({ firstName: e.target.value }),
      lastName: s.lastName, onLastName: (e) => this.setState({ lastName: e.target.value }),
      education: s.education, onEducation: (e) => this.setState({ education: e.target.value }),
      experienceOptions: ['Менее года', '1-3 года', '3-5 лет', '5-10 лет', 'Более 10 лет'],
      experience: s.experience, onExperience: (e) => this.setState({ experience: e.target.value }),
      price: s.price, onPrice: (e) => this.setState({ price: e.target.value.replace(/\D/g,'') }),
      specializations: Component.SPECS.map(label => ({ label, selected: s.selectedSpecs.includes(label), onClick: () => this.setState({ selectedSpecs: this.toggle(s.selectedSpecs, label) }) })),
      formats: Component.FORMATS.map(f => ({ ...f, selected: s.selectedFormats.includes(f.id), onClick: () => this.setState({ selectedFormats: this.toggle(s.selectedFormats, f.id) }) })),
      goBack: () => { window.history.back(); },
      showToast: s.showToast,
      onSave: () => { this.setState({ showToast: true }); setTimeout(() => { window.location.href = './SmartQoldau Expert - Профиль.dc.html'; }, 900); },
    };
  }
}

</script>
</body>
</html>
