<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#fff} ::-webkit-scrollbar{display:none} *{scrollbar-width:none}</style>
</helmet>
<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f2f7">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ false }}" hint-size="390,844">
  <div style="position:relative;width:100%;height:100%;background:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden">

    <div style="position:absolute;inset:0;overflow-y:auto;padding:64px 22px 40px;box-sizing:border-box">
      <div onClick="{{ goBack }}" style="width:36px;height:36px;border-radius:50%;background:#f2f2f0;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:22px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#0f3f3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <sc-if value="{{ blocked }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:16px;background:#fdece3;margin-bottom:12px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 8v5M12 16v.1" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="#c0392b" stroke-width="1.6"/></svg>
          <div style="font-size:13.5px;font-weight:700;color:#c0392b">Профиль временно заблокирован</div>
        </div>
        <div style="font-size:12.5px;font-weight:500;color:#6b8580;line-height:1.5;margin-bottom:24px">Приём новых консультаций приостановлен. Обратитесь в поддержку, чтобы узнать причину и восстановить доступ</div>
      </sc-if>
      <sc-if value="{{ !blocked }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:16px;background:#f2fbf8;margin-bottom:24px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 12l2 2 4-4M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z" stroke="#0f766e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div style="font-size:13.5px;font-weight:700;color:#0f766e">Профиль подтверждён</div>
        </div>
      </sc-if>

      <div style="font-size:13px;font-weight:700;color:#0f3f3a;margin-bottom:12px">Документы</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <sc-for list="{{ docs }}" as="d" hint-placeholder-count="4">
          <div style="display:flex;align-items:center;gap:14px;border:1px solid #edf2f0;border-radius:16px;padding:14px">
            <div style="width:40px;height:40px;border-radius:12px;background:{{ d.bg }};display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M14 3v4a1 1 0 001 1h4 M6 2h8l6 6v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2z" stroke="{{ d.color }}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div style="flex:1;min-width:0">
              <div style="font-size:13.5px;font-weight:700;color:#0f3f3a">{{ d.title }}</div>
              <div style="font-size:11.5px;font-weight:700;color:{{ d.color }}">{{ d.status }}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  renderVals() {
    const blocked = new URLSearchParams(window.location.search).get('demo') === 'blocked';
    return {
      blocked,
      goBack: () => { window.history.back(); },
      docs: [
        { title: 'Удостоверение личности', status: 'Подтверждено', bg: '#e3f3ee', color: '#159a7c' },
        { title: 'Диплом об образовании', status: 'Подтверждено', bg: '#e3f3ee', color: '#159a7c' },
        { title: 'Сертификаты', status: 'Подтверждено', bg: '#e3f3ee', color: '#159a7c' },
        { title: 'Документы о квалификации', status: 'Подтверждено', bg: '#e3f3ee', color: '#159a7c' },
      ],
    };
  }
}

</script>
</body>
</html>
