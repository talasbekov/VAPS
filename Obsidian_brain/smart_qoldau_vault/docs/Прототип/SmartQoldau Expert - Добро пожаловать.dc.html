<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#fff} a{color:#0f766e}</style>
</helmet>
<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f2f7">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ false }}" hint-size="390,844">
  <div style="position:relative;width:100%;height:100%;background:linear-gradient(180deg,#ffffff 0%,#f7fbfa 60%,#eaf5f1 100%);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden">

    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 30px;box-sizing:border-box">
      <img src="uploads/logo_smartqoldau.png" alt="SmartQoldau" style="width:88px;height:88px;border-radius:22px;box-shadow:0 16px 40px -10px rgba(15,118,110,0.28);margin-bottom:28px">
      <div style="font-size:24px;font-weight:800;color:#0f3f3a;text-align:center;line-height:1.3">Добро пожаловать в<br>SmartQoldau Expert</div>
      <div style="font-size:14.5px;font-weight:500;color:#6b8580;text-align:center;line-height:1.6;margin-top:12px;max-width:270px">Профессиональная платформа для работы с клиентами</div>
    </div>

    <div style="position:absolute;left:0;right:0;bottom:0;padding:0 22px 40px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px">
      <button onClick="{{ goLogin }}" style="width:100%;height:54px;border:none;border-radius:27px;background:#0f766e;color:#fff;font-family:inherit;font-size:15.5px;font-weight:700;cursor:pointer">Продолжить с номером телефона</button>
      <div onClick="{{ goClientApp }}" style="text-align:center;font-size:13px;font-weight:600;color:#0f766e;cursor:pointer;padding:6px 0">Это приложение для клиентов? Перейти в SmartQoldau</div>
      <div style="text-align:center;font-size:11.5px;font-weight:500;color:#8fa6a1;line-height:1.6;margin-top:2px">Продолжая, вы принимаете <a href="#" style="text-decoration:underline;font-weight:600">Условия для специалистов</a> и <a href="#" style="text-decoration:underline;font-weight:600">Политику конфиденциальности</a></div>
    </div>
  </div>
</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  renderVals() {
    return {
      goLogin: () => { window.location.href = './SmartQoldau Expert - Регистрация.dc.html'; },
      goClientApp: () => { window.location.href = './SmartQoldau - Добро пожаловать.dc.html'; },
    };
  }
}

</script>
</body>
</html>
