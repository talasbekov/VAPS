<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#0f2320;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}</style>
</helmet>
<div style="width:100%;min-height:100vh;display:flex;justify-content:center;background:#0f2320;padding:24px;box-sizing:border-box">
  <div style="width:1440px;max-width:100%;min-height:1024px;position:relative;background:#1a2b28;border-radius:20px;overflow:hidden">

    <div style="position:absolute;inset:0;background:linear-gradient(160deg,#2f4744,#233a36);display:flex;align-items:center;justify-content:center">
      <div style="width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2 M12 11a4 4 0 100-8 4 4 0 000 8z" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <div style="position:absolute;top:24px;left:24px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.3);padding:10px 16px;border-radius:14px">
      <div style="width:7px;height:7px;border-radius:50%;background:#2ecc71"></div>
      <div style="font-size:14px;font-weight:800;color:#fff">Анонимный клиент #1048</div>
      <div style="font-size:13px;font-weight:600;color:rgba(255,255,255,0.6)">· {{ timerText }}</div>
    </div>

    <div style="position:absolute;top:24px;right:24px;width:220px;height:150px;border-radius:16px;background:#2b3d3a;border:1.5px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;overflow:hidden">
      <div style="width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:rgba(255,255,255,0.7)">А</div>
      <div style="position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;color:rgba(255,255,255,0.6)">Вы</div>
    </div>

    <div style="position:absolute;bottom:0;left:0;right:0;padding:0 30px 36px;display:flex;flex-direction:column;align-items:center;gap:16px">
      <div style="display:flex;align-items:center;gap:6px">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2" stroke="rgba(255,255,255,0.5)" stroke-width="1.8"/><path d="M8 11V7a4 4 0 018 0v4" stroke="rgba(255,255,255,0.5)" stroke-width="1.8"/></svg>
        <div style="font-size:12px;font-weight:500;color:rgba(255,255,255,0.5)">Конфиденциальная консультация</div>
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        <button onClick="{{ toggleMute }}" style="width:56px;height:56px;border-radius:50%;border:none;background:{{ muteBg }};display:flex;align-items:center;justify-content:center;cursor:pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 5a3 3 0 016 0v6a3 3 0 01-6 0V5z" stroke="{{ muteColor }}" stroke-width="1.8"/><path d="M5 11a7 7 0 0014 0M12 18v3" stroke="{{ muteColor }}" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button onClick="{{ toggleCamera }}" style="width:56px;height:56px;border-radius:50%;border:none;background:{{ cameraBg }};display:flex;align-items:center;justify-content:center;cursor:pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="12" height="10" rx="2.5" stroke="{{ cameraColor }}" stroke-width="1.8"/><path d="M15 10l6-3v10l-6-3" stroke="{{ cameraColor }}" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
        <button onClick="{{ toggleScreenShare }}" style="width:56px;height:56px;border-radius:50%;border:none;background:{{ screenBg }};display:flex;align-items:center;justify-content:center;cursor:pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="13" rx="2" stroke="{{ screenColor }}" stroke-width="1.8"/><path d="M8 21h8M12 17v4" stroke="{{ screenColor }}" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button onClick="{{ toggleChat }}" style="width:56px;height:56px;border-radius:50%;border:none;background:{{ chatBg }};display:flex;align-items:center;justify-content:center;cursor:pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5z" stroke="{{ chatColor }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button onClick="{{ endCall }}" style="width:68px;height:68px;border-radius:50%;border:none;background:#e14b3f;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 14px 28px -8px rgba(225,75,63,0.5)">
          <svg width="24" height="24" viewBox="0 0 24 24" style="display:block;transform:rotate(135deg)"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" fill="#fff"/></svg>
        </button>
        <button style="width:56px;height:56px;border-radius:50%;border:none;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;cursor:pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="#fff" stroke-width="1.8"/></svg>
        </button>
      </div>
    </div>

    <sc-if value="{{ showChat }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;top:0;right:0;bottom:0;width:320px;background:#fff;padding:24px 20px;box-sizing:border-box;display:flex;flex-direction:column">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
          <div style="font-size:15px;font-weight:800;color:#0f3f3a">Чат консультации</div>
          <div onClick="{{ toggleChat }}" style="cursor:pointer;color:#8fa6a1;font-size:13px;font-weight:700">✕</div>
        </div>
        <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px">
          <div style="align-self:flex-start;max-width:85%;background:#f8faf9;border-radius:14px 14px 14px 4px;padding:10px 13px;font-size:12.5px;color:#0f3f3a">Спасибо за консультацию, мне легче</div>
        </div>
        <input placeholder="Написать в чат..." style="height:42px;border:1.5px solid #eef2f0;border-radius:21px;padding:0 14px;font-size:12.5px;margin-top:10px;font-family:inherit"/>
      </div>
    </sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  state = { muted: false, camera: true, screenShare: false, showChat: false, seconds: 24 * 60 + 18 };
  componentDidMount() { this._t = setInterval(() => this.setState(s => ({ seconds: s.seconds + 1 })), 1000); }
  componentWillUnmount() { clearInterval(this._t); }
  renderVals() {
    const s = this.state;
    const h = Math.floor(s.seconds / 3600), m = Math.floor((s.seconds % 3600) / 60), sec = s.seconds % 60;
    return {
      timerText: `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`,
      muteBg: s.muted ? '#fff' : 'rgba(255,255,255,0.15)', muteColor: s.muted ? '#0f3f3a' : '#fff',
      cameraBg: s.camera ? 'rgba(255,255,255,0.15)' : '#fff', cameraColor: s.camera ? '#fff' : '#0f3f3a',
      screenBg: s.screenShare ? '#fff' : 'rgba(255,255,255,0.15)', screenColor: s.screenShare ? '#0f3f3a' : '#fff',
      chatBg: s.showChat ? '#fff' : 'rgba(255,255,255,0.15)', chatColor: s.showChat ? '#0f3f3a' : '#fff',
      showChat: s.showChat,
      toggleMute: () => this.setState(s2 => ({ muted: !s2.muted })),
      toggleCamera: () => this.setState(s2 => ({ camera: !s2.camera })),
      toggleScreenShare: () => this.setState(s2 => ({ screenShare: !s2.screenShare })),
      toggleChat: () => this.setState(s2 => ({ showChat: !s2.showChat })),
      endCall: () => { window.location.href = './SmartQoldau Expert Web - Консультации.dc.html'; },
    };
  }
}

</script>
</body>
</html>
