<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif} a{color:#0f766e} a:hover{color:#0a5951}</style>
</helmet>
<div style="width:100%;background:#fff;min-height:100vh">
  <div style="position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);border-bottom:1px solid #eef2f0">
    <div style="max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 32px;gap:24px">
      <a href="./SmartQoldau.kz.dc.html" style="display:flex;align-items:center;gap:9px;text-decoration:none">
        <img src="uploads/logo_smartqoldau.png" alt="SmartQoldau" style="width:32px;height:32px;border-radius:9px">
        <div style="font-size:16px;font-weight:800;color:#0f3f3a">SmartQoldau</div>
      </a>
      <a href="./SmartQoldau.kz.dc.html" style="font-size:13px;font-weight:700;color:#0f3f3a;text-decoration:none">← На главную</a>
    </div>
  </div>

  <div style="max-width:1240px;margin:0 auto;padding:56px 32px 90px">
    <div style="font-size:30px;font-weight:800;color:#0f3f3a;margin-bottom:8px">Поддержка доступна не только во время консультации</div>
    <div style="font-size:14.5px;font-weight:500;color:#6b8580;margin-bottom:36px">Инструменты для самостоятельной работы с тревогой и стрессом</div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px">
      <sc-for list="{{ materials }}" as="m" hint-placeholder-count="4">
        <a href="{{ m.href }}" style="text-decoration:none;background:#fff;border-radius:20px;border:1px solid #eef2f0;padding:26px;display:block">
          <div style="width:48px;height:48px;border-radius:14px;background:{{ m.bg }};display:flex;align-items:center;justify-content:center;margin-bottom:16px">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="{{ m.icon }}" stroke="{{ m.color }}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div style="font-size:16px;font-weight:800;color:#0f3f3a;margin-bottom:6px">{{ m.title }}</div>
          <div style="font-size:13px;font-weight:500;color:#6b8580;line-height:1.5">{{ m.text }}</div>
        </a>
      </sc-for>
    </div>

    <div style="margin-top:36px;border-radius:18px;background:#f7faf9;padding:18px 22px;font-size:13px;font-weight:500;color:#6b8580">Эти инструменты открываются в мобильном интерфейсе SmartQoldau — так же, как в приложении.</div>
  </div>

  <div style="background:#0f3f3a;padding:30px 32px;text-align:center;font-size:12px;font-weight:500;color:rgba(255,255,255,0.4)">© SmartQoldau</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  renderVals() {
    return {
      materials: [
        { title: 'Дыхательные упражнения', text: 'Техники для снижения тревоги за несколько минут.', bg: '#e3f3ee', color: '#159a7c', icon: 'M12 21a9 9 0 100-18 9 9 0 000 18z M8 12a4 4 0 108 0 4 4 0 00-8 0z', href: './SmartQoldau - Дыхательное упражнение.dc.html' },
        { title: 'Расслабляющая музыка', text: 'Подборка для восстановления и концентрации.', bg: '#e6f0fb', color: '#3b82c4', icon: 'M9 18V5l12-2v13 M9 9l12-2 M6 21a3 3 0 100-6 3 3 0 000 6z M18 19a3 3 0 100-6 3 3 0 000 6z', href: './SmartQoldau - Расслабляющая музыка.dc.html' },
        { title: 'Полезные статьи', text: 'Материалы от психологов о тревоге, отношениях и выгорании.', bg: '#fdece3', color: '#e08a4d', icon: 'M4 19.5A2.5 2.5 0 016.5 17H20 M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z', href: './SmartQoldau - Полезные статьи.dc.html' },
        { title: 'Медитации', text: 'Практики для снижения стресса и улучшения сна.', bg: '#f1eafb', color: '#8b5fc9', icon: 'M12 3v2M12 19v2M5 12H3M21 12h-2 M7 7a5 5 0 0110 0c0 3-2 4-2 6H9c0-2-2-3-2-6z', href: './SmartQoldau - Медитации.dc.html' },
      ],
    };
  }
}

</script>
</body>
</html>
