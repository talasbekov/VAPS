services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vaps
      POSTGRES_PASSWORD: vaps
      POSTGRES_DB: vaps
    ports:
      - "5433:5432"
    healthcheck:
      # -h 127.0.0.1: временный сервер initdb-фазы слушает только unix-socket,
      # TCP-проверка исключает ложный healthy до рестарта на боевую конфигурацию
      test: ["CMD-SHELL", "pg_isready -U vaps -d vaps -h 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 30s
