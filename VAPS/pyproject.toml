[project]
name = "vaps"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<5.2",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.1",
    # Story 1.8: simple .xlsx output (AC-1). Pure-Python, no C extensions,
    # offline-friendly — runs inside the air-gapped контур in the
    # migration_legacy image. The deliberate end of 1.7's zero-runtime-deps.
    "openpyxl>=3,<4",
    # Story 5.1: verify external-Auth JWTs (signature/exp/alg-allowlist). `[crypto]`
    # pulls `cryptography` for RS256/asymmetric — the issuer's public key is the
    # only trust anchor; VAPS stores no passwords (ARCH-SEC-030).
    "PyJWT[crypto]>=2,<3",
    # Story 8.3: OpenAPI-схема для кодогена типов фронта (ARCH-FE-011). Minor-пин:
    # формат вывода spectacular — контракт drift-чека (lock-файла у бэка нет),
    # апгрейд = осознанный regen-коммит schema.yaml + schema.d.ts.
    "drf-spectacular>=0.30,<0.31",
    # Story 6.3: официальный .docx расхода (перенос из донора — тот же пин
    # 1.2.0, что в donor requirements.txt; registry-снимок 1.2.0 на 2026-07-08).
    # Offline-friendly: default-template внутри пакета, сети не касается. ЧЕСТНО:
    # тянет lxml (C-extension) — осознанное отступление от openpyxl-обоснования
    # «no C extensions»; бинарные wheels вендорятся в offline-зеркало контура.
    "python-docx>=1.2,<2",
    # Story 6.4: нативный PDF расхода. Донорского прообраза НЕТ (донор PDF
    # расхода не генерирует — проверено grep'ом reports-app); выбор fpdf2
    # (registry-снимок 2.8.7 на 2026-07-08): декларативный table() +
    # add_font(TTF) для kk-глифов, API проверен эмпирически на create-story.
    # Альтернатива reportlab (донор пинит 4.5.1 в ДРУГОЙ подсистеме) отклонена
    # (Д5/Q2). ЧЕСТНО: LGPL-3.0 + тянет Pillow (C-extension), fonttools,
    # defusedxml — wheels вендорятся в offline-зеркало контура (прецедент Q2-6.3).
    "fpdf2>=2.8,<3",
    # Story 11.1: ASGI/WebSocket-транспорт уведомлений (FR-35). Снимок PyPI
    # 2026-07-19: channels 4.3.2 (классификатор `Framework :: Django :: 5.1` —
    # совместим с пином Django>=5.0,<5.2), channels-redis 4.3.0 (требует
    # channels>=4.2.2 — пин ниже это удовлетворяет). channels-redis обязателен,
    # а не опционален: InMemoryChannelLayer теряет group_send из чужого процесса
    # МОЛЧА (architecture.md#L337), т.е. деградация неотличима от «нет событий».
    # ЧЕСТНО: channels-redis тянет redis>=4.6 и msgpack~=1.0 — msgpack это
    # C-extension, бинарные wheels вендорятся в offline-зеркало контура
    # (прецедент python-docx/lxml выше; architecture.md#L56, #L264).
    "channels>=4.3,<5",
    "channels-redis>=4.3,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.15",
    "hypothesis>=6,<7",
    # Story 6.4: парсер PDF в тестах (round-trip/extract_text); BSD-3,
    # pure-python, снимок 5.6.0 на 2026-07-08.
    "pypdf>=5,<6",
    # Story 11.1: первая async-поверхность проекта — async-тесты WS-consumer'а
    # (свой WsCommunicator поверх asgiref.testing: channels.testing тянет daphne,
    # запрещённый AC-9 — решение Bratan 2026-07-19). Снимок 1.4.0 на 2026-07-19;
    # pure-python.
    "pytest-asyncio>=1,<2",
    # Story 11.6: живой ASGI-сервер для браузерного e2e (`npm run test:e2e:live`).
    # Живого ASGI-сервера в проекте не было ни одного: `manage.py runserver` без
    # daphne — обычный WSGI, WebSocket он не отдаёт вовсе, а daphne запрещён
    # прямым решением Bratan (11.1 AC-1: +14 транзитивных пакетов и 3
    # C-расширения в офлайн-зеркало). uvicorn при этом НЕ выбирается здесь — он
    # уже выбран архитектурой как прод-сервер (config/asgi.py:1-22 «uvicorn
    # (--lifespan off)», epics.md#L1280 Story 12.1); стори лишь ставит принятое
    # решение на эпик раньше и ТОЛЬКО в dev-extra — в рантайм-зависимости его
    # переносит 12.1 вместе с прод-образом.
    # Голый uvicorn, а НЕ uvicorn[standard]: extra тянет httptools, uvloop,
    # watchfiles и python-dotenv — четыре лишних пакета (два с C-расширениями) в
    # офлайн-зеркало ради скорости, которая в e2e не нужна. WS-поддержки в голом
    # uvicorn нет: без websockets/wsproto он поднимется и будет МОЛЧА отклонять
    # апгрейд, поэтому `websockets` пинится явно (снимок 2026-07-19; pure-python).
    "uvicorn>=0.30,<1",
    "websockets>=13,<16",
]

[tool.setuptools]
packages = ["config", "apps", "apps.core"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["apps"]
addopts = "--strict-markers"
# Story 11.1: явный @pytest.mark.asyncio на каждом async-тесте (стиль проекта —
# "auto" подхватывал бы корутины неявно). Маркер `asyncio` регистрирует сам
# плагин, поэтому --strict-markers с ним не конфликтует. loop_scope задан явно:
# без него pytest-asyncio 1.x пишет DeprecationWarning на каждом прогоне.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "property: property-based tests (hypothesis)",
    "concurrency: concurrency smoke tests",
    "slow: tests that take more than a few seconds",
    "golden: golden-master регрессия расхода (числа + нормализованный document.xml); только test-full",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
