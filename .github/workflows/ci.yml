name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migrations-check:
    name: makemigrations --check (no model/migration drift)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/PersonnelStatus/Personnel-Records
    env:
      DJANGO_SETTINGS_MODULE: organization_management.config.settings.test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/PersonnelStatus/Personnel-Records/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing migrations
        # Fails the build if model state and migrations have drifted apart.
        run: python manage.py makemigrations --check --dry-run
