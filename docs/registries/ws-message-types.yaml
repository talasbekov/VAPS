# docs/registries/ws-message-types.yaml
# Реестр типов WebSocket-/in-app-уведомлений VAPS — разыменовывает СТОП-правило.
#
# ПРАВИЛО: тип сообщения, которого нет в реестре, использовать НЕЛЬЗЯ → СТОП и спроси
#   (architecture.md «Как читать этот документ», п.5). Новый тип — тем же PR.
#
# КОНТРАКТ WS (architecture.md §Communication Patterns):
#   {"type": "<UPPER_SNAKE из реестра>", "payload": {...}}
#   - отправка ТОЛЬКО через transaction.on_commit;
#   - WS — сигнал «обнови», ИСТИНА — REST/БД; после reconnect фронт дочитывает REST;
#   - доставка best-effort; уведомление всегда персистится в БД (DB-first) — таблица
#     `notifications`, колонка `kind` (story 5.7a).
#   type_code здесь = и тип WS-конверта, и значение колонки `notifications.kind`
#   (§4.5 / §33). Ранее шапка называла таблицу `notifications_messages` — донорское
#   имя, в VAPS такой таблицы нет (story 11.2, AC-1).
#
# СТАТУС РЕАЛИЗАЦИИ: эмитируется сегодня ровно ОДИН тип — SUBMISSION_LAGGING
#   (5.7a/5.7b пишут строку, 11.2 шлёт её в WS). Остальные 24 — форвард-семена
#   эпиков 14-20: в коде VAPS не эмитируется НИ ОДИН. Поэтому гвард реестра
#   (test_ws_guards.py) однонаправлен — code ⊆ registry, а не наоборот.

meta:
  registry: ws-message-types
  source_spec: docs/PersonnelStatus/VAPS_7.8.2.md
  source_section: "§33.2 Notification event matrix; §33.3 payload; §4.5 Notifications Context"
  generated_by_story: "1.12"
  generated_on: "2026-06-19"
  growth_rule: "Тип не в реестре → СТОП. Новые типы — тем же PR."
  priorities: [INFO, WARNING, CRITICAL]
  payload_fields: [type_code, title, body, entity_type, entity_id, action_url, priority, expires_at]

types:
  # Единственный тип, у которого есть живой эмиттер (lagging_check._emit_lagging →
  # notifications.services.notify). Семантически НЕ дубль DAILY_MARK_MISSING ниже:
  # там «09:00 нет INITIAL-отметки» операторам подразделения, здесь — catch-up
  # несдачи за ПРОШЕДШИЙ день по watermark, адресат резолвится NotifyRecipient.
  SUBMISSION_LAGGING:
    priority: WARNING
    recipients: "division submission recipients"
    repeat: "daily until submitted"
    action_url: "/daily-expense"
    trigger: "catch-up несдачи за прошедший день (lagging_check)"
    source: "VAPS story 5.7a/5.7b — реальный эмиттер, не донор"
  # Не дубль SUBMISSION_LAGGING: тот — catch-up ПОЛНОГО отсутствия сдачи за
  # ПРОШЕДШИЙ день (проверяется следующим утром); этот — интрадей-предупреждение
  # о ЧАСТИЧНОМ отставании В ТЕЧЕНИЕ дня (доля необходимых управлений ниже
  # порога к настраиваемому часу). Модель — 13.5a; эмиттер (13.5b) не готов на
  # момент регистрации типа.
  SUBMISSION_THRESHOLD_ALERT:
    priority: WARNING
    recipients: "division submission recipients / ответственный"
    repeat: "once per business_date (UniqueConstraint)"
    action_url: "/daily-expense"
    trigger: "доля сдавших < alert_threshold_pct к alert_hour (интрадей)"
    source: "VAPS story 13.5a (модель) / 13.5b (эмиттер) — epics.md#L1380-1387"
  # Не дубль SUBMISSION_THRESHOLD_ALERT: тот — только на недобор, гейт
  # alert_hour (Admin-настройка). Этот — ЕЖЕДНЕВНО, независимо от исхода
  # дня (сдачи есть/нет), фиксированный час отсечки 20:00 (литерал, не
  # настройка) — сама сводка есть сигнал «цикл дня дошёл до проверки».
  PILOT_PULSE_DIGEST:
    priority: INFO
    recipients: "ответственный (default_notify_recipient)"
    repeat: "once per business_date (UniqueConstraint)"
    action_url: "/daily-expense"
    trigger: "ежедневная сводка после 20:00 (сдачи/активные пользователи/день тишины)"
    source: "VAPS story 13.5c — epics.md#L1380-1387"
  DAILY_MARK_MISSING:
    priority: WARNING
    recipients: "division operators"
    repeat: "daily until mark"
    action_url: "/daily-expense"
    trigger: "09:00 нет INITIAL-отметки"
    source: "VAPS_7.8.2 §33.2"
  DAILY_MARK_ESCALATION:
    priority: CRITICAL
    recipients: "OMD/ORGD/supervisor"
    repeat: "daily until mark"
    action_url: "/daily-expense"
    trigger: "11:00 нет INITIAL-отметки"
    source: "VAPS_7.8.2 §33.2"
  REPORT_READY:
    priority: INFO
    recipients: "requester"
    repeat: "no"
    action_url: "/reports/{id}"
    trigger: "документ сгенерирован"
    source: "VAPS_7.8.2 §33.2"
  REPORT_FAILED:
    priority: WARNING
    recipients: "requester/admin"
    repeat: "no"
    action_url: "/reports/{id}"
    trigger: "генерация документа провалилась"
    source: "VAPS_7.8.2 §33.2"
  EVENT_BULLETIN_CREATED:
    priority: INFO
    recipients: "event participants/senior"
    repeat: "no"
    action_url: "/events/{id}"
    trigger: "бюллетень создан"
    source: "VAPS_7.8.2 §33.2"
  RECON_REQUIRED:
    priority: WARNING
    recipients: "responsible user"
    repeat: "no"
    action_url: "/events/{id}/reconnaissance"
    trigger: "событию нужна рекогносцировка"
    source: "VAPS_7.8.2 §33.2"
  NEED_RETURNED:
    priority: WARNING
    recipients: "need author"
    repeat: "no"
    action_url: "/events/{id}/need"
    trigger: "потребность возвращена"
    source: "VAPS_7.8.2 §33.2"
  RESOURCE_REQUEST_SENT:
    priority: INFO
    recipients: "target division operator"
    repeat: "no"
    action_url: "/events/{id}/requests"
    trigger: "запрос создан"
    source: "VAPS_7.8.2 §33.2"
  ALLOCATION_CONFIRMED:
    priority: INFO
    recipients: "event senior/OMD"
    repeat: "no"
    action_url: "/events/{id}/requests"
    trigger: "выделение подтверждено"
    source: "VAPS_7.8.2 §33.2"
  ASSIGNMENT_SUBMITTED:
    priority: WARNING
    recipients: "approver"
    repeat: "no"
    action_url: "/assignment-versions/{id}"
    trigger: "версия расстановки подана"
    source: "VAPS_7.8.2 §33.2"
  ASSIGNMENT_RETURNED:
    priority: WARNING
    recipients: "creator/senior"
    repeat: "no"
    action_url: "/assignment-versions/{id}"
    trigger: "версия возвращена"
    source: "VAPS_7.8.2 §33.2"
  ASSIGNMENT_APPROVED:
    priority: INFO
    recipients: "assigned employees/senior"
    repeat: "no"
    action_url: "/assignment-versions/{id}"
    trigger: "версия утверждена"
    source: "VAPS_7.8.2 §33.2"
  ACK_REQUIRED:
    priority: WARNING
    recipients: "assigned employee"
    repeat: "every 2h until ack during event prep"
    action_url: "/assignments/{id}"
    trigger: "создано требование ознакомления"
    source: "VAPS_7.8.2 §33.2"
  ACK_MISSING_ESCALATION:
    priority: CRITICAL
    recipients: "senior"
    repeat: "once"
    action_url: "/assignment-versions/{id}/acknowledgements"
    trigger: "близко начало события, ознакомление не получено"
    source: "VAPS_7.8.2 §33.2"
  SOFT_CONFLICT_DETECTED:
    priority: WARNING
    recipients: "creator/senior"
    repeat: "no"
    action_url: "/assignment-versions/{id}"
    trigger: "создан soft-конфликт"
    source: "VAPS_7.8.2 §33.2"
  HARD_BLOCK_ATTEMPT:
    priority: WARNING
    recipients: "actor/admin optional"
    repeat: "no"
    action_url: "/assignment-versions/{id}"
    trigger: "попытка hard-block назначения"
    source: "VAPS_7.8.2 §33.2"
  REPLACEMENT_CREATED:
    priority: WARNING
    recipients: "senior/affected users"
    repeat: "no"
    action_url: "/events/{id}"
    trigger: "замена после утверждения"
    source: "VAPS_7.8.2 §33.2"
  INCIDENT_CREATED:
    priority: CRITICAL
    recipients: "HQ/senior/OMD"
    repeat: "no"
    action_url: "/events/{id}/incidents"
    trigger: "инцидент открыт"
    source: "VAPS_7.8.2 §33.2"
  INCIDENT_CLOSED:
    priority: INFO
    recipients: "HQ/senior"
    repeat: "no"
    action_url: "/events/{id}/incidents"
    trigger: "инцидент закрыт"
    source: "VAPS_7.8.2 §33.2"
  EVENT_READY_BLOCKED:
    priority: WARNING
    recipients: "event senior"
    repeat: "every 4h until resolved"
    action_url: "/events/{id}"
    trigger: "блокер готовности"
    source: "VAPS_7.8.2 §33.2"
  TEMP_PERMISSION_ACTIVE:
    priority: INFO
    recipients: "duty user"
    repeat: "no"
    action_url: "/"
    trigger: "временное полномочие началось"
    source: "VAPS_7.8.2 §33.2"
  TEMP_PERMISSION_EXPIRED:
    priority: INFO
    recipients: "duty user"
    repeat: "no"
    action_url: "/"
    trigger: "временное полномочие истекло"
    source: "VAPS_7.8.2 §33.2"
  IMPORT_COMPLETED:
    priority: INFO
    recipients: "requester"
    repeat: "no"
    action_url: "/admin/import-export"
    trigger: "импорт-джоба успешна"
    source: "VAPS_7.8.2 §33.2"
  IMPORT_FAILED:
    priority: WARNING
    recipients: "requester/admin"
    repeat: "no"
    action_url: "/admin/import-export"
    trigger: "импорт-джоба провалилась"
    source: "VAPS_7.8.2 §33.2"
  # Story 15.10, FR-42. Полная иерархия «управление → зам → рук.
  # департамента» упрощена до brokerage.manage-держателей (открытый вопрос,
  # нет данных/селектора для полной вертикали в этом домене) — recipients
  # ниже отражает РЕАЛЬНОГО получателя, не буквальный FR-42-текст.
  GROUP_FORCE_REQUEST_ESCALATED:
    priority: WARNING
    recipients: "brokerage.manage holders (упрощение — не полная вертикаль FR-42)"
    repeat: "once per recipient per business_date (UniqueConstraint), digest per run"
    action_url: "/security-events"
    trigger: "GroupForceRequest SENT/PARTIALLY_ALLOCATED дольше VAPS_FORCE_REQUEST_ESCALATION_DAYS (PROVISIONAL — architecture.md AR-11 STOP-маркер)"
    source: "VAPS story 15.10 — реальный эмиттер, epics.md FR-42"
