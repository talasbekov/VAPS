# docs/registries/audit-events.yaml
# Реестр типов аудит-событий VAPS (значения audit_logs.action) — разыменовывает СТОП-правило.
#
# ПРАВИЛО: тип аудит-события, которого нет в реестре, использовать НЕЛЬЗЯ → СТОП и спроси
#   (architecture.md «Как читать этот документ», п.5; §Communication Patterns: «action UPPER_SNAKE
#   из реестра»). Новый action — тем же PR, что вводит мутацию.
#
# ВНИМАНИЕ — провенанс: спека НЕ перечисляет аудит-действия одним списком. Явно заданы только два
#   AUTH_LEGACY_TOKEN_* (§81) + контролируемый словарь action_code истории статусов (DB-OPS-032 CHECK / §4).
#   Остальные действия ВЫВЕДЕНЫ из правила §6 «все мутации пишутся в audit_logs» + конкретных API/BR,
#   которые требуют аудит (помечены provenance: derived-from-mutation со ссылкой-основанием).
#   Это СТАРТОВЫЙ seed: при реализации каждой мутирующей стори E2+ её action дописывается сюда тем же PR.

meta:
  registry: audit-events
  source_spec: docs/PersonnelStatus/VAPS_7.8.2.md
  source_section: "§4.6 Audit Context (audit_logs.action); §6 (все мутации → audit_logs); §81 (legacy-token)"
  generated_by_story: "1.12"
  generated_on: "2026-06-19"
  growth_rule: "Action не в реестре → СТОП. Каждая мутирующая стори E2+ дописывает свой action тем же PR."
  record_shape: "audit_logs: actor_user_id, action, entity_type, entity_id, before/after JSON, request_id, IP (architecture.md §Communication Patterns)"

# audit_logs.action — типы аудит-событий.
actions:
  AUTH_LEGACY_TOKEN_ACCEPTED:
    entity_type: auth
    description: "Аутентификация по legacy-токену прошла успешно."
    provenance: spec-explicit
    source: "VAPS_7.8.2 §81 (adapter, п.5)"
  AUTH_LEGACY_TOKEN_REJECTED:
    entity_type: auth
    description: "Невалидная попытка legacy-токена (актор идентифицируем)."
    provenance: spec-explicit
    source: "VAPS_7.8.2 §81 (adapter, п.6)"
  ASSIGNMENT_CREATED:
    entity_type: assignment
    description: "Создано индивидуальное назначение."
    provenance: derived-from-mutation
    source: "VAPS_7.8.2 API-OPS-001 (audit required)"
  ASSIGNMENT_DELETED:
    entity_type: assignment
    description: "Удалено назначение (сброс брокериджа BR-008)."
    provenance: derived-from-mutation
    source: "VAPS_7.8.2 API-OPS-002 (audit required)"
  GROUP_ASSIGNMENT_CREATED:
    entity_type: assignment
    description: "Групповое назначение — одна сводная запись в audit_logs."
    provenance: derived-from-mutation
    source: "VAPS_7.8.2 BR-005 (§ «пишет одну сводную запись в audit_logs»)"
  POST_DEACTIVATED:
    entity_type: post
    description: "Деактивация поста в окне деактивации."
    provenance: derived-from-mutation
    source: "VAPS_7.8.2 BR-016 (§ «действие пишется в audit_logs»)"
  DOCUMENT_DOWNLOADED:
    entity_type: document
    description: "Скачивание чувствительного документа (обязательный аудит)."
    provenance: derived-from-mutation
    source: "VAPS_7.8.2 BR-DOC-003 (§ «скачивание … фиксируется в audit_logs»)"
  # Форвард-семя E6 (ретро E5 урок №4): сеет первая генераторная стори (6.3),
  # эмиссия — Story 6.5 (выпуск расхода). Эмиссий в 6.3 НЕТ — прецедент
  # DOCUMENT_DOWNLOADED, живущего в реестре без эмиссии до 6.7 (growth_rule:
  # action дописывается тем же PR, что вводит зону мутации).
  DOCUMENT_GENERATED:
    entity_type: document
    description: "Официальный документ сгенерирован из derive(снапшот) (байты собраны, ещё не выпущены)."
    provenance: derived-from-mutation
    source: "prd.md FR-17; VAPS_7.8.2 §34; epics.md Story 6.5"
  DOCUMENT_ISSUED:
    entity_type: document
    description: "Документ выпущен: файл + sha256 + номер закреплены за выпуском (Attachment)."
    provenance: derived-from-mutation
    source: "prd.md FR-17; VAPS_7.8.2 §34; epics.md Story 6.5"
  DOCUMENT_SUPERSEDED:
    entity_type: document
    description: "Документ выдан «взамен исх. №» — прежний выпуск помечен заменённым."
    provenance: derived-from-mutation
    source: "prd.md FR-17; VAPS_7.8.2 §34; epics.md Story 6.5"
  ATTACHMENT_UPLOADED:
    entity_type: attachment
    description: "Файл загружен в приватное хранилище (строка Attachment создана; метаданные в new_value)."
    provenance: derived-from-mutation
    source: "VAPS_7.8.2 §6 «все мутации пишутся в audit_logs» + BR-DOC-001; epics.md Story 6.1"
  DAILY_SUBMISSION_SUBMITTED:
    entity_type: daily_submission
    description: "Подразделение сдало день (акт сдачи, снапшот)."
    provenance: derived-from-mutation
    source: "architecture.md ARCH-DATA-021; см. дельта-секцию VAPS_7.8.2"
  DAILY_SUBMISSION_AMENDED:
    entity_type: daily_submission
    description: "Пересдача/amendment сданного дня (кто/когда/причина/санкция)."
    provenance: derived-from-mutation
    source: "architecture.md ARCH-DATA-021 (amendment-flow)"
  DAILY_SUMMARY_ASSEMBLED:
    entity_type: daily_submission
    description: "Собрана сводка родительского подразделения (та же DailySubmission + пины sources прямых детей; payload — sources-компакт без снапшота)."
    provenance: derived-from-mutation
    source: "epics.md Story 5.11; architecture.md ARCH-DATA-021 (фрактальность)"
  DAILY_SUMMARY_REBUILT:
    entity_type: daily_submission
    description: "Явная пересборка сводки «взамен» (amendment сводки: свежий own-срез + свежие пины; before/after)."
    provenance: derived-from-mutation
    source: "epics.md Story 5.11; architecture.md ARCH-DATA-021 (фрактальность, «взамен»)"
  TOMORROW_BLOCK_OVERRIDDEN:
    entity_type: tomorrow_block_override
    description: "Легальный обход блокировки «на завтра» (кто/когда/почему; 5.6b override)."
    provenance: derived-from-mutation
    source: "epics.md Story 5.9; architecture.md ARCH-DATA-021 (блокировка следующего дня)"
  # Story 10.8 (growth_rule: action дописывается тем же PR, что вводит выдачу).
  # GET-роут ⇒ строки в AUDIT_MATRIX НЕТ — она отбирает только мутирующие
  # глаголы (прецедент DOCUMENT_DOWNLOADED). entity_id = division_id (UUID),
  # int-pk сдачи — в new_value.submission_id.
  SUBMISSION_EXPORTED:
    entity_type: daily_submission
    description: "Оператор выгрузил личную копию сданного дня (.xlsx «щит»; обязательный аудит — нет журнала, нет выдачи)."
    provenance: derived-from-mutation
    source: "epics.md Story 10.8 (§ «скачивание в аудите»); ARCH-SEC-032 (аудит в сервисе)"

  # --- Story 4.4: мутации статусов из сервисов E3 (синхронно-на-мутации, before/after) ---
  # entity_id = employee_id (UUID) — AuditLog.entity_id это UUIDField, а PK статус-сущностей
  # integer; PK конкретной строки кладётся в new_value (.status_id и т.п.).
  STATUS_CREATED:
    entity_type: employee_status
    description: "Статус создан оператором (create_status / bulk-строка)."
    provenance: derived-from-mutation
    source: "epics.md Story 4.4; status_service.create_status (FR-36, AR-9)"
  STATUS_UPDATED:
    entity_type: employee_status
    description: "Правка метаданных/интервала статуса (update_status)."
    provenance: derived-from-mutation
    source: "epics.md Story 4.4; status_service.update_status"
  STATUS_EXTENDED:
    entity_type: employee_status
    description: "Интервал статуса продлён (extend_status)."
    provenance: derived-from-mutation
    source: "epics.md Story 4.4; status_service.extend_status"
  STATUS_COMPLETED:
    entity_type: employee_status
    description: "Статус досрочно завершён фактической датой (complete_status_early)."
    provenance: derived-from-mutation
    source: "epics.md Story 4.4; status_service.complete_status_early"
  STATUS_CANCELLED:
    entity_type: employee_status
    description: "Не начавшийся (PLANNED) статус отменён (cancel_status)."
    provenance: derived-from-mutation
    source: "epics.md Story 4.4; status_service.cancel_status"
  STATUS_CLARIFICATION_RESOLVED:
    entity_type: employee_status
    description: "Статус «уточняется» разрешён ретро-заменой в реальный (resolve_pending_clarification)."
    provenance: derived-from-mutation
    source: "epics.md Story 4.4; status_service.resolve_pending_clarification"
  OVERRIDE_APPLIED:
    entity_type: override
    description: "Обход soft-конфликта оператором — отдельное считаемое событие (SM-C1)."
    provenance: derived-from-mutation
    source: "architecture.md:52 «каждый override — считаемое событие»; epics.md Story 4.4"
  STATUS_BULK_CREATED:
    entity_type: employee_status
    description: "Сводное событие массового создания (N построчных STATUS_CREATED + одно сводное)."
    provenance: derived-from-mutation
    source: "epics.md Story 4.4 (bulk N+сводное); BR-005-паттерн «одна сводная запись»"
  SECONDMENT_INITIATED:
    entity_type: secondment
    description: "Откомандирование инициировано — пара DETACHED+ATTACHED (initiate_secondment)."
    provenance: derived-from-mutation
    source: "epics.md Story 4.4; secondment_service.initiate_secondment (FR-14)"
  SECONDMENT_RETURN_REQUESTED:
    entity_type: secondment
    description: "Запрошен возврат из откомандирования (request_return)."
    provenance: derived-from-mutation
    source: "epics.md Story 4.4; secondment_service.request_return (FR-15)"
  SECONDMENT_RETURNED:
    entity_type: secondment
    description: "Возврат подтверждён — обе ноги закрыты одним событием (confirm_return)."
    provenance: derived-from-mutation
    source: "epics.md Story 4.4; secondment_service.confirm_return (FR-15)"

  # --- Story 4.7: аудит увольнения (named-дефер 4.4 №6=B) ---
  EMPLOYEE_DISMISSED:
    entity_type: employee
    description: "Сотрудник уволен — карточка в архив, активные статусы усечены, секондменты закрыты (одно композитное событие на оркестраторе dismiss_employee)."
    provenance: derived-from-mutation
    source: "Story 4.7 (named-дефер 4.4 №6=B); operations dismissal.dismiss_employee (FR-36, AR-9)"

  # --- Story 7.7: режим «без двойного ввода» — переключатель гейтит production
  #   write-путь (submit_day), включение/выключение и правки пилот-списка аудируются. ---
  PARALLEL_RUN_MODE_ENABLED:
    entity_type: parallel_run_mode
    description: "Режим «без двойного ввода» включён — донор источник ввода, ручная сдача дня закрыта (кроме пилотных подразделений)."
    provenance: derived-from-mutation
    source: "epics.md Story 7.7"
  PARALLEL_RUN_MODE_DISABLED:
    entity_type: parallel_run_mode
    description: "Режим «без двойного ввода» выключен (например, при cutover — Story 7.10)."
    provenance: derived-from-mutation
    source: "epics.md Story 7.7, 7.10"
  PARALLEL_RUN_PILOT_DIVISION_ADDED:
    entity_type: parallel_run_mode
    description: "Подразделение добавлено в пилотный список исключений (ручной ввод разрешён даже при включённом режиме)."
    provenance: derived-from-mutation
    source: "epics.md Story 7.7"
  PARALLEL_RUN_PILOT_DIVISION_REMOVED:
    entity_type: parallel_run_mode
    description: "Подразделение удалено из пилотного списка исключений."
    provenance: derived-from-mutation
    source: "epics.md Story 7.7"
  ROSTER_RECONCILIATION_SIGNED:
    entity_type: roster_reconciliation
    description: "Владелец расхода пилотного подразделения подтвердил (подписал) сверку выгруженного «как в системе» состава с реальностью на дату."
    provenance: derived-from-mutation
    source: "epics.md Story 7.9"
  PARALLEL_RUN_CUTOVER_COMPLETED:
    entity_type: parallel_run_mode
    description: "Cutover выполнен по рунбуку (exit criterion выполнен) — официальный канал расхода переключён на VAPS, донор перестаёт быть источником ввода."
    provenance: derived-from-mutation
    source: "epics.md Story 7.10"
  PARALLEL_RUN_CUTOVER_ROLLED_BACK:
    entity_type: parallel_run_mode
    description: "Откат cutover — донор снова источник ввода (parallel-run возобновлён с новым дедлайном)."
    provenance: derived-from-mutation
    source: "epics.md Story 7.10"
  DIAGNOSTICS_EXPORTED:
    entity_type: diagnostics_export
    description: "manage.py export_diagnostics — багрепорты+audit-журнал за период выгружены в архив для выноса носителем; ПЕРВАЯ management-команда, пишущая AuditLog вне HTTP-контекста (record()'s _SYSTEM_IP-сентинел)."
    provenance: derived-from-mutation
    source: "epics.md Story 13.2"
  DUTY_PLAN_CREATED:
    entity_type: duty_plan
    description: "Создан план дежурств (DRAFT). entity_id — uuid.UUID(int=plan.pk) (DutyPlan — integer PK, не UUID)."
    provenance: derived-from-mutation
    source: "epics.md Story 14.11a; Story 14.12a"
  DUTY_PLAN_APPROVED:
    entity_type: duty_plan
    description: "План дежурств утверждён (DRAFT→APPROVED, BR-017). Эмитится ТОЛЬКО на реальном переходе — идемпотентный повторный вызов на уже-APPROVED не дублирует строку."
    provenance: derived-from-mutation
    source: "epics.md Story 14.11c; Story 14.12a"
  DUTY_SHIFT_CREATED:
    entity_type: duty_shift
    description: "Создана смена дежурства в плане. entity_id — uuid.UUID(int=shift.pk)."
    provenance: derived-from-mutation
    source: "epics.md Story 14.11b; Story 14.12a"
  DUTY_SHIFT_CANCELLED:
    entity_type: duty_shift
    description: "Смена дежурства отменена (причина обязательна). Эмитится и при прямой отмене, и внутри перепланирования (старая смена реально отменяется в обоих случаях)."
    provenance: derived-from-mutation
    source: "epics.md Story 14.11d; Story 14.12a"
  DUTY_SHIFT_REPLANNED:
    entity_type: duty_shift
    description: "Смена перепланирована — старая отменена (свой DUTY_SHIFT_CANCELLED), новая создана. entity_id — uuid.UUID(int=new_shift.pk)."
    provenance: derived-from-mutation
    source: "epics.md Story 14.11e; Story 14.12a"
  SECURITY_EVENT_CREATED:
    entity_type: security_event
    description: "Создан ОМ (DRAFT), опционально со Старшим объекта (senior_employee_id). entity_id — uuid.UUID(int=event.pk)."
    provenance: derived-from-mutation
    source: "epics.md FR-21; Story 15.2a"
  SECURITY_EVENT_BULLETIN_ISSUED:
    entity_type: security_event
    description: "Бюллетень выпущен (DRAFT->BULLETIN). Эмитится ТОЛЬКО на реальном переходе — идемпотентный повторный вызов на уже-BULLETIN не дублирует строку."
    provenance: derived-from-mutation
    source: "epics.md FR-21; Story 15.2b"
  SECURITY_EVENT_RECON_CONFIRMED:
    entity_type: security_event
    description: "Рекогносцировка подтверждена двойным контролем (BULLETIN->RECON), два РАЗНЫХ актора. Эмитится ТОЛЬКО на реальном переходе (второе подтверждение) — первое подтверждение не аудируется (промежуточное состояние)."
    provenance: derived-from-mutation
    source: "epics.md FR-22; Story 15.3c"
  SECURITY_EVENT_STARTED:
    entity_type: security_event
    description: "Проведение начато (APPROVED->IN_PROGRESS). Эмитится ТОЛЬКО на реальном переходе — идемпотентный повторный вызов на уже-IN_PROGRESS не дублирует строку. Недостающее звено между Расстановкой (16.x) и журналом/оперативным изменением (Epic 17), которые гейтят IN_PROGRESS."
    provenance: derived-from-mutation
    source: "epics.md FR-28/FR-29; Story 18.1"
  SECURITY_EVENT_CLOSED:
    entity_type: security_event
    description: "ОМ закрыто (IN_PROGRESS->CLOSED) — требует итог по каждому направлению (SecurityEventSectorPost.sector). НЕ идемпотентно (терминальный переход, повторный вызов на уже-CLOSED — 422). new_value несёт снимок всех итогов направлений."
    provenance: derived-from-mutation
    source: "epics.md FR-30; Story 18.1"
  ASSIGNMENT_ACTUAL_TIME_RECORDED:
    entity_type: placement_assignment_actual
    description: "Фактическое время назначения записано/исправлено (опрос по итогам, только для CLOSED-события и is_current версии). Эмитится на КАЖДОМ вызове (upsert, включая исправление) — реальная бизнес-данные, не черновик. entity_id — uuid.UUID(int=actual.pk)."
    provenance: derived-from-mutation
    source: "epics.md FR-43; Story 18.3"
  OBJECT_PASSPORT_UPDATED:
    entity_type: object_passport
    description: "Паспорт объекта обновлён в контексте ОМ (только пока ОМ в статусе RECON, FR-22). entity_id — uuid.UUID(int=passport.pk). Реальная мутация с compliance-следом (не черновик, в отличие от 15.3b's чек-листа) — аудируется на каждом вызове."
    provenance: derived-from-mutation
    source: "epics.md FR-22; Story 15.4"
  SECURITY_EVENT_DEMAND_APPROVED:
    entity_type: security_event
    description: "Потребность в силах утверждена (RECON->DEMAND). Эмитится ТОЛЬКО на реальном переходе, содержит снимок утверждённых строк staffing_demand для прослеживаемости. Single-actor гейт (не двойной контроль — FR-23 его не требует, в отличие от FR-22)."
    provenance: derived-from-mutation
    source: "epics.md FR-23; Story 15.5c"
  SECURITY_EVENT_FORCE_REQUESTS_GENERATED:
    entity_type: security_event
    description: "Запросы Группам сгенерированы и отправлены (агрегация StaffingDemand по группе). Эмитится на каждом вызове (включая идемпотентный regenerate) — реальная бизнес-операция (рассылка), не черновик. new_value включает requested_groups + unmatched_groups для прослеживаемости."
    provenance: derived-from-mutation
    source: "epics.md FR-24; Story 15.7b"
  GROUP_FORCE_REQUEST_ALLOCATED:
    entity_type: group_force_request
    description: "Брокер выделил людей на запрос Группы. entity_id — uuid.UUID(int=request.pk). Эмитится ТОЛЬКО на реальном изменении (allocated_count и/или comment) — идемпотентный повтор того же значения не дублирует строку. status выводится из allocated_count vs requested_count, не отдельный клиентский вход."
    provenance: derived-from-mutation
    source: "epics.md FR-24; Story 15.8"
  SECURITY_EVENT_DIRECT_ASSIGNMENT_CREATED:
    entity_type: security_event_direct_assignment
    description: "Физнаряд создан — ОМД напрямую назначил сотрудника на пост, минуя запрос Группе/брокеридж. entity_id — uuid.UUID(int=assignment.pk). Система пассивна: НЕТ проверки двойного назначения."
    provenance: derived-from-mutation
    source: "epics.md FR-24; Story 15.9"
  SECURITY_EVENT_DIRECT_ASSIGNMENT_DELETED:
    entity_type: security_event_direct_assignment
    description: "Физнаряд снят (человеческое решение спора за человека)."
    provenance: derived-from-mutation
    source: "epics.md FR-24; Story 15.9"
  GROUP_FORCE_REQUEST_ESCALATED:
    entity_type: group_force_request
    description: "Батч-эскалация неотработанных запросов Группам (FR-42) — один аудит-ряд на прогон catch-up-job'а, entity_id — сентинел uuid.UUID(int=0) (тот же паттерн, что bulk_status_service's _BULK_SUMMARY_ENTITY_ID), new_value несёт полный список escalated_request_ids. Актор — SYSTEM (автоматический прогон, не пользователь)."
    provenance: derived-from-mutation
    source: "epics.md FR-42; Story 15.10"
  TEMP_DUTY_GRANTED:
    entity_type: temporary_duty_permission
    description: "Выдача срочного дежурного полномочия ОМД/ОРГД (FR-34) — entity_id=uuid.UUID(int=grant.pk) (operations — integer PK). Актор — created_by (тот, кто выдал), new_value несёт снимок user_id/duty_role_code/starts_at/ends_at/scope_division_id/event_id."
    provenance: derived-from-mutation
    source: "epics.md FR-34; Story 15.11a"
  TEMP_DUTY_EXPIRED:
    entity_type: temporary_duty_permission
    description: "Явное гашение дежурного полномочия через POST /temporary-duty/{id}/expire/ — пишется ТОЛЬКО на реальном переходе is_active True→False (идемпотентно, повторный вызов на уже погашенной/несуществующей строке аудит не дублирует). Актор — request.actor_id."
    provenance: derived-from-mutation
    source: "epics.md FR-34; Story 15.11a"
  PLACEMENT_DRAFT_FORMED:
    entity_type: assignment_version
    description: "Авто-формирование ЧЕРНОВОЙ версии Расстановки из физнаряда (SecurityEventDirectAssignment) — entity_id=uuid.UUID(int=version.pk) (operations — integer PK). new_value несёт matched_count/unmatched_count/unmatched (список нерезолвленных постов). Первая аудит-запись Epic 16."
    provenance: derived-from-mutation
    source: "epics.md FR-26; Story 16.2"
  ASSIGNMENT_VERSION_SUBMITTED:
    entity_type: assignment_version
    description: "Черновая версия Расстановки подана на согласование (DRAFT→SUBMITTED) — только на реальном переходе, не на идемпотентном повторе."
    provenance: derived-from-mutation
    source: "epics.md FR-26; Story 16.4"
  ASSIGNMENT_VERSION_RETURNED:
    entity_type: assignment_version
    description: "Версия возвращена на доработку (SUBMITTED→RETURNED) — терминально для этой версии; new_value несёт reason и id новой созданной DRAFT-версии (flip-before-insert, тот же паттерн, что amend_day)."
    provenance: derived-from-mutation
    source: "epics.md FR-26; Story 16.4"
  ASSIGNMENT_VERSION_APPROVED:
    entity_type: assignment_version
    description: "Версия утверждена (SUBMITTED→APPROVED), один approver — только на реальном переходе. new_value несёт signature_hash (hash-ready заглушка ЭЦП — architecture.md откладывает реальное ЭЦП на MVP-2) и override/override_reason, если утверждение прошло несмотря на конфликты (SOFT_CONFLICT_DETECTED)."
    provenance: derived-from-mutation
    source: "epics.md FR-26; Story 16.4"
  ASSIGNMENT_VERSION_AMENDED:
    entity_type: assignment_version
    description: "Оперативное изменение расстановки ПОСЛЕ утверждения (новая версия сразу APPROVED, is_amendment=True) — доступно только для текущей утверждённой версии, пока событие в IN_PROGRESS. new_value несёт reason/sanction (оба обязательны) и new_version_id; old_value — old_version_id."
    provenance: derived-from-mutation
    source: "epics.md FR-28; Story 17.3"
  ASSIGNMENT_REPLACEMENT_ESCALATED:
    entity_type: assignment_version
    description: "Каскадная замена выбывшего не нашла кандидата ни в управлении, ни в департаменте (FR-31); версия НЕ создаётся, эскалация фиксируется только аудитом (уведомление — отдельная Story 17.6). new_value несёт departed_employee_id, post_id."
    provenance: derived-from-mutation
    source: "epics.md FR-31; Story 17.5"
  PLACEMENT_ASSIGNMENT_ACKNOWLEDGED:
    entity_type: placement_assignment
    description: "Сотрудник отметил ознакомление со своим назначением (acknowledged_at: null→timestamp) — только на реальном переходе, не на идемпотентном повторе; entity_id=uuid.UUID(int=assignment.pk) (operations — integer PK). Доступно только для APPROVED-версии; личность актора не проверяется (16.8's территория)."
    provenance: derived-from-mutation
    source: "epics.md FR-27; Story 16.6b"
  PLACEMENT_ACKNOWLEDGEMENT_ESCALATED:
    entity_type: placement_assignment
    description: "Батч-эскалация отсутствующего ознакомления старшему события (ack_escalated_at: null→timestamp на N строках за один прогон) — entity_id=uuid.UUID(int=0) (batch-summary sentinel, тот же приём, что GROUP_FORCE_REQUEST_ESCALATED). Актор — SYSTEM (беспилотный batch, не HTTP-запрос)."
    provenance: derived-from-mutation
    source: "epics.md FR-27; Story 16.6c"
  PLACEMENT_ACK_REMINDER_SENT:
    entity_type: placement_assignment
    description: "Батч-напоминание об ознакомлении назначенным сотрудникам (ACK_REQUIRED) — не мутирует ни одной строки (нет watermark-поля, намеренно, см. Story 16.6e's Scope Decision), только фиксирует факт прогона; entity_id=uuid.UUID(int=0) (batch-summary sentinel). Актор — SYSTEM."
    provenance: derived-from-mutation
    source: "epics.md FR-27; Story 16.6e"
  JOURNAL_ENTRY_CREATED:
    entity_type: security_event
    description: "Запись журнала штаба создана (инструктаж/указание) — доступно только пока событие в статусе IN_PROGRESS (режим проведения). entity_id — uuid.UUID(int=event.pk) (тот же приём, что SECURITY_EVENT_BULLETIN_ISSUED)."
    provenance: derived-from-mutation
    source: "epics.md FR-29; Story 17.1"

# Контролируемый словарь ops_employee_status_history.action_code — каноничен и аудируем
#   (мутации статусов — самая аудит-нагруженная область). Это НЕ audit_logs.action, но тот же UPPER_SNAKE.
status_history_action_codes:
  CREATED:    { description: "Статус создан вручную.", source: "VAPS_7.8.2 DB-OPS-032 action_code CHECK" }
  APPLIED:    { description: "Статус применён автоматически (актор SYSTEM, BR-001 проекции).", source: "VAPS_7.8.2 DB-OPS-032 action_code CHECK; BR-001 проекция" }
  EXTENDED:   { description: "Интервал статуса продлён.", source: "VAPS_7.8.2 DB-OPS-032 action_code CHECK" }
  TERMINATED: { description: "Статус досрочно прекращён.", source: "VAPS_7.8.2 DB-OPS-032 action_code CHECK" }
  COMPLETED:  { description: "Статус завершён штатно (актор SYSTEM).", source: "VAPS_7.8.2 DB-OPS-032 action_code CHECK; BR-001 проекция" }
  CANCELLED:  { description: "Статус отменён.", source: "VAPS_7.8.2 DB-OPS-032 action_code CHECK" }
  MODIFIED:   { description: "Статус изменён (поля кроме интервала).", source: "VAPS_7.8.2 DB-OPS-032 action_code CHECK" }
